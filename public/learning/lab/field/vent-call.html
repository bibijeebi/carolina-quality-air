<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vent Call: dryer vent casework</title>
<meta name="description" content="Five dryer vent jobs. Inspect the run, make the code calls, clean, figure developed length, run the DEDP test, and make the pass or fail call.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1c2b36;--muted:#5d7282;--paper:#f3f7fa;--sheet:#fff;--line:#d3dee6;--blue:#007cba;--blue-soft:#dcedf7;--rust:#b5452f;--gold:#e8a917;--gold-soft:#fff3cf;--green:#2e8b57;--green-soft:#e1f2e8;--red:#c0392b;--red-soft:#fbe4e1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-size:15px;line-height:1.42}
button,input,select{font:inherit;color:inherit}
#app{max-width:1180px;margin:0 auto;padding:10px 12px 18px;display:grid;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar h1{font-family:'Hind Madurai',Jost,sans-serif;font-size:1.25rem;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--blue)}
.home{font-weight:700;color:var(--blue);text-decoration:none;font-size:.85rem;border:1px solid #b7cad7;border-radius:3px;padding:6px 10px;min-height:36px;display:inline-flex;align-items:center;background:#fff}
.home:hover{background:var(--blue-soft)}
.bar .acts{display:flex;gap:8px;margin-left:auto}
@media (max-width:700px){.bar .acts{width:100%;margin-left:0}.bar .acts .btn{flex:1}}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:3px;padding:7px 12px;min-height:40px;font-weight:600;cursor:pointer}
.btn.alt{background:#fff;color:var(--blue);border-color:#b7cad7}
.btn:disabled{opacity:.45;cursor:default}
.cases{display:flex;flex-wrap:wrap;gap:6px}
.case{border:1px solid var(--line);background:#fff;border-radius:3px;padding:5px 10px;font-size:.82rem;cursor:pointer;min-height:36px;text-align:left}
.case b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.case.on{border-color:var(--blue);background:var(--blue-soft)}
.case.done b::after{content:" · best " attr(data-best);color:var(--green)}
.board{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(310px,1fr);gap:10px;align-items:start}
.plan{background:var(--sheet);border:1px solid var(--line);border-radius:3px}
.plan svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-width:0}
.card h2{font-size:1.02rem;margin:0 0 4px;font-family:'Hind Madurai',Jost,sans-serif}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 4px}
.steps{display:flex;flex-wrap:nowrap;border-bottom:1px solid var(--line);margin:-4px -4px 10px}
.step{flex:1 1 auto;border:0;background:none;padding:8px 5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;min-height:44px;white-space:nowrap}
@media (max-width:420px){.step{font-size:.8rem;padding:8px 2px}}
.step.on{color:var(--blue);border-bottom-color:var(--blue)}
.step .d{font-size:.72rem;color:var(--green);margin-left:3px}
.memo{background:#fffdf5;border:1px solid #efe3bf;border-radius:3px;padding:10px 12px;font-size:.92rem}.memo p{margin:.3em 0}
.find{border-left:4px solid var(--line);padding:6px 10px;margin:6px 0;font-size:.88rem;background:#fbfcfd}
.find.issue{border-left-color:var(--rust);background:#fdf6f4}
.find b{display:block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 10px;font-size:.8rem;cursor:pointer;min-height:34px;text-align:left}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff}
.opt{display:block;width:100%;text-align:left;border:1px solid #b7cad7;background:#fff;border-radius:3px;padding:8px 10px;min-height:44px;margin:5px 0;cursor:pointer}
.opt.on{border-color:var(--blue);background:var(--blue-soft);font-weight:600}
.opt small{display:block;color:var(--muted);font-weight:400}
.gauge{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.dial{font-family:'Hind Madurai',Jost,sans-serif;font-size:1.8rem;font-weight:700;background:#1c2b36;color:#7ee0a1;padding:4px 14px;border-radius:4px;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
.dial small{font-size:.8rem;color:#9fb3c3;margin-left:4px}
.num{width:110px;padding:8px;border:1px solid #b7cad7;border-radius:3px;min-height:42px}
.tbl{border-collapse:collapse;font-size:.82rem;margin-top:6px;width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.tbl th{background:#f3f7fa}
.msg{font-size:.9rem;min-height:2.4em}.msg span{display:block;color:var(--muted);font-size:.83rem}
#over{position:fixed;inset:0;background:#1c2b36cc;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:5}
#over .card{max-width:760px;width:100%}
.big{font-family:'Hind Madurai',Jost,sans-serif;font-size:3rem;font-weight:700;color:var(--blue);line-height:1}
.rep{list-style:none;padding:0;margin:10px 0}.rep li{padding:6px 10px;margin:4px 0;border-left:4px solid var(--green);background:var(--green-soft);font-size:.88rem}
.rep li.bad{border-left-color:var(--red);background:var(--red-soft)}.rep li span{display:block;color:var(--muted);font-size:.8rem}
.lbl{font-size:12px;fill:var(--muted);pointer-events:none}
.hit{fill:transparent;stroke:transparent;cursor:pointer}
@media (max-width:860px){.board{grid-template-columns:1fr}.plan{position:sticky;top:0;z-index:2;box-shadow:0 4px 10px #1c2b3614}}
/* field kit: shared with the lab shell */
:root{color-scheme:light}
:focus-visible{outline:3px solid #c48000;outline-offset:3px}
:focus:not(:focus-visible){outline:none}
.seg button:focus-visible,.tabs button:focus-visible,.tab:focus-visible,.step:focus-visible{outline-offset:-3px}
.in-frame .bar>a.home,.in-frame .bar>h1,.in-frame .wrap>a.home,.in-frame .wrap>h1{position:absolute!important;width:1px;height:1px;margin:0;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.in-frame .scene,.in-frame .plan{position:relative!important;top:auto!important;box-shadow:none!important}
.in-frame #over{padding-top:12px}
.resume{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:#e8f3fa;border:1px solid #9bbfd5;border-left:4px solid #007cba;border-radius:3px;padding:10px 12px}
.resume-txt b{display:block}.resume-txt span{display:block;font-size:.85rem;color:#526878}
.resume-acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
<script>
/* Field training frame kit: framing, auto height, report dialog, saved runs. Same block in every field/*.html. */
(function(){
  var root=document.documentElement,framed=false;
  try{framed=window.parent!==window&&window.parent.location.origin===location.origin;}catch(e){framed=false;}
  if(framed)root.classList.add('in-frame');
  var FT=window.FT={framed:framed,banner:null};
  function post(m){if(framed){try{window.parent.postMessage(m,location.origin);}catch(e){}}}
  FT.post=post;
  var lastH=0,over=function(){return document.getElementById('over');};
  function size(){
    if(!framed)return;
    var h=Math.ceil(root.getBoundingClientRect().height),o=over();
    if(o&&o.style.display&&o.style.display!=='none'&&o.firstElementChild)h=Math.max(h,Math.ceil(o.firstElementChild.getBoundingClientRect().height)+60);
    if(h!==lastH){lastH=h;post({vel:'field-size',h:h});}
  }
  FT.size=size;
  document.addEventListener('DOMContentLoaded',function(){
    if(framed){
      // The lab shell shows the title and the way back; keep ours out of the tab order and the reading order.
      document.querySelectorAll('.bar > a.home, .wrap > a.home').forEach(function(a){a.setAttribute('tabindex','-1');a.setAttribute('aria-hidden','true');});
      if('ResizeObserver' in window){var ro=new ResizeObserver(size);ro.observe(root);var o=over();if(o&&o.firstElementChild)ro.observe(o.firstElementChild);}
      window.addEventListener('load',size);size();
    } else {
      document.querySelectorAll('a[target="_top"]').forEach(function(a){if(a.dataset.solo)a.setAttribute('href',a.dataset.solo);a.removeAttribute('target');});
    }
  });
  // ---- the report dialog ----
  var ret=null;
  function focusables(o){return Array.prototype.filter.call(o.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'),function(e){return e.getClientRects().length>0;});}
  function trap(e){
    var o=over();if(!o||o.style.display==='none')return;
    e.stopPropagation(); // tool shortcuts stay off while the report is up; default actions still run
    if(e.key==='Escape'){e.preventDefault();FT.closeOver();return;}
    if(e.key!=='Tab')return;
    var f=focusables(o);if(!f.length){e.preventDefault();return;}
    var a=f[0],z=f[f.length-1],cur=document.activeElement;
    if(!o.contains(cur)){e.preventDefault();a.focus();}
    else if(e.shiftKey&&cur===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus();}
  }
  FT.openOver=function(back,first){
    var o=over(),app=document.getElementById('app');ret=back||null;
    o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
    var h=o.querySelector('.big');if(h){h.id=h.id||'report-score';o.setAttribute('aria-labelledby',h.id);}
    o.style.display='flex';o.scrollTop=0;if(app)app.inert=true;
    document.addEventListener('keydown',trap,true);
    var f=first||focusables(o)[0];if(f)f.focus({preventScroll:true});
    if(framed){post({vel:'field-overlay'});size();}
  };
  FT.closeOver=function(){
    var o=over(),app=document.getElementById('app');
    o.style.display='none';if(app)app.inert=false;
    document.removeEventListener('keydown',trap,true);
    if(ret&&document.contains(ret)){try{ret.focus();}catch(e){}}
    size();
  };
  // ---- saved runs: one key per tool, versioned ----
  FT.run=function(tool){
    var K='vel-field-run-'+tool;
    return {
      load:function(){try{var v=JSON.parse(localStorage.getItem(K)||'null');return v&&v.v===1&&v.d&&typeof v.d==='object'&&!Array.isArray(v.d)?v:null;}catch(e){return null;}},
      save:function(d){try{localStorage.setItem(K,JSON.stringify({v:1,at:Date.now(),d:d}));}catch(e){}if(FT.banner){FT.banner.remove();FT.banner=null;size();}},
      clear:function(){try{localStorage.removeItem(K);}catch(e){}if(FT.banner){FT.banner.remove();FT.banner=null;size();}}
    };
  };
  FT.offerResume=function(o){
    var b=document.createElement('div'),when='';
    try{when=new Date(o.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){}
    b.className='resume';b.setAttribute('role','region');b.setAttribute('aria-label','Saved job');
    b.innerHTML='<div class="resume-txt"><b>You have a job in progress.</b><span></span></div><div class="resume-acts"><button type="button" class="btn">Resume your job</button><button type="button" class="btn alt">Start a new one</button></div>';
    b.querySelector('span').textContent=o.text+(when?' Saved '+when+'.':'');
    var bs=b.querySelectorAll('button');
    bs[0].onclick=function(){b.remove();FT.banner=null;try{o.resume();}catch(e){o.run.clear();}size();};
    bs[1].onclick=function(){o.run.clear();if(o.fresh)o.fresh();size();};
    var bar=document.querySelector('#app > .bar');if(bar)bar.after(b);else document.body.prepend(b);
    FT.banner=b;
  };
  // Scores for the hub: vel-field is {tool:{n,best,last,at}}; anything else is replaced.
  FT.record=function(tool,score){
    try{var K='vel-field',m={};try{var v=JSON.parse(localStorage.getItem(K)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))m=v;}catch(e){}
      var r=m[tool]&&typeof m[tool]==='object'?m[tool]:{};var n=Number.isFinite(r.n)?r.n:0,best=Number.isFinite(r.best)?r.best:0;
      m[tool]={n:n+1,best:Math.max(best,score),last:score,at:Date.now()};localStorage.setItem(K,JSON.stringify(m));}catch(e){}
    post({vel:'field',tool:tool});
  };
})();
</script>
</head>
<body>
<div id="app">
  <div class="bar"><a class="home" href="../#/field" target="_top">&larr; Field training</a>
    <h1>Vent Call</h1><div class="acts"><button type="button" class="btn" id="submit">Submit the call</button></div></div>
  <div class="cases" id="cases"></div>
  <div class="board">
    <div class="plan"><svg id="svg" viewBox="0 0 800 460" role="img" aria-label="Cutaway of the house showing the dryer exhaust run"></svg></div>
    <div class="card">
      <div class="steps" id="steps"></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div id="pane"></div>
    </div>
  </div>
</div>
<div id="over"><div class="card" id="report"></div></div>
<script>
'use strict';
// Sources: NADCA DEDP 2014 (sections cited inline) and IRC 2024 M1501-M1502.
const CODE={
  vinyl:['Transition not listed and labeled to UL 2158A','IRC M1502.4.3'],
  screen:['Screen at the termination','IRC M1502.3'],
  attic:['Exhaust ends in the attic, not outdoors','IRC M1501.1, M1502.3'],
  clear3:['Terminal within 3 ft of an opening into the building','IRC M1502.3'],
  label:['Over 35 ft equivalent with no length label','IRC M1502.4.7'],
  screws:['Fasteners stick into the duct more than 1/8 in','IRC M1502.4.2'],
  trans8:['Transition longer than 8 ft','IRC M1502.4.3']
};
const RECS={
  r_trans:'Reconnect with a single UL 2158A listed transition, 8 ft max, left exposed',
  r_screen:'Take the screen out of the termination',
  r_route:'Reroute the duct to terminate outdoors through a hood with a backdraft damper',
  r_clear:'Move the terminal at least 3 ft from any opening',
  r_label:'Put a length label within 6 ft of the duct connection',
  r_screws:'Replace the fasteners so none stick in more than 1/8 in',
  r_design:'Design change: shorten the route; cleaning will not fix this'
};
const T49=[[10,.30,1700],[20,.55,1600],[30,.65,1500],[40,.75,1300],[50,.80,1200]], T410=[[10,.50,1700],[20,.75,1600],[30,.85,1500],[40,.95,1300],[50,1.00,1200]];
const D='Rigid 4 in metal, smooth inside, sealed and fastened at the joints.';
const CASES=[
 {id:1,title:'Side wall, two elbows',term:'side',straight:10,elbows:2,
  order:['<b>Call:</b> Clothes take two cycles to dry.','<b>House:</b> Single story, laundry on an interior wall, vents out the side of the house.'],
  path:[[200,380],[320,380],[320,300],[560,300]],segs:['3 ft','2 ft','5 ft'],
  obs:{trans:{t:'White plastic transition, about 5 ft, kinked behind the dryer. No UL 2158A label on it.',code:['vinyl']},hood:{t:'Louvered side-wall hood. The flaps move, but the barrier is furred over with lint.',lint:true}},
  gauge:.48,vel:[1580,1640,1610],recs:['r_trans']},
 {id:2,title:'Roof cap',term:'roof',straight:20,elbows:2,
  order:['<b>Call:</b> Burning smell when the dryer runs. Birds heard on the roof.','<b>House:</b> Two story. The run goes up through the attic to a roof cap.'],
  path:[[200,390],[200,150],[380,150],[380,106]],segs:['8 ft','7 ft','5 ft'],
  obs:{hood:{t:'Roof cap with a wire mesh screen behind the flap. The screen is packed with lint and a bird nest.',code:['screen'],lint:true},trans:{t:'Semi-rigid aluminum transition, 4 ft, UL 2158A label on it.'}},
  gauge:.80,vel:[1470,1520,1495],recs:['r_screen']},
 {id:3,title:'Nobody knows where it ends',term:'none',straight:14,elbows:1,
  order:['<b>Call:</b> Owner wants the dryer vent cleaned. "Nobody has ever found where it comes out."','<b>House:</b> Ranch with a walk-in attic. No cap visible on the roof or the walls.'],
  path:[[200,390],[200,200],[360,200]],segs:['8 ft','6 ft'],noHood:true,
  obs:{d2:{t:'The rigid run ends open in the attic. No termination, just a drift of lint across the insulation.',code:['attic']},trans:{t:'Foil transition with a UL 2158A label, 3 ft, exposed.'}},
  gauge:null,vel:null,recs:['r_route']},
 {id:4,title:'The long way around',term:'side',straight:35,elbows:3,
  order:['<b>Call:</b> Dryer shuts off on high heat. Owner already had the vent cleaned last year.','<b>House:</b> Laundry in the middle of the house. The run goes up, across the attic, and back down to a side wall.'],
  path:[[200,390],[200,170],[430,170],[430,300],[560,300]],segs:['8 ft','10 ft','5 ft','12 ft'],window:true,
  obs:{hood:{t:'Side-wall hood with a damper that swings free. A bedroom window opens 2 ft above it.',code:['clear3']},port:{t:'Collar tight to the drywall. No length label anywhere near the dryer connection.',code:['label']},trans:{t:'Semi-rigid aluminum transition, 4 ft, UL 2158A label.'}},
  gauge:.85,vel:[1250,1230,1210],recs:['r_design','r_label','r_clear']},
 {id:5,title:'Booster fan on the roof run',term:'roof',straight:30,elbows:2,booster:true,trap:true,
  order:['<b>Call:</b> Annual service. The house has a dryer booster fan and a secondary lint trap.','<b>House:</b> Two story, laundry upstairs, long attic run to a roof cap.'],
  path:[[200,390],[200,185],[400,185],[400,120]],segs:['10 ft','14 ft','6 ft'],
  obs:{d2:{t:'Joints in the attic run fastened with long sheet metal screws. About 1/2 in pokes into the airstream, and lint hangs on every one.',code:['screws']},port:{t:'Length label at the connection reads "Equivalent length 40 ft", mounted 3 ft from it.'},booster:{t:'Inline dryer exhaust duct power ventilator in the attic run, labeled UL 705 for dryer duct service. The pressure switch clicks on when air moves. It runs.'},trap:{t:'Secondary lint trap next to the dryer. The screen is packed full.',lint:true},trans:{t:'Semi-rigid aluminum transition, 5 ft, UL 2158A label.'}},
  gauge:.90,vel:[1280,1330,1310],recs:['r_screws']}
];
const parts=C=>{const p=['dryer','trans','port'];C.segs.forEach((_,i)=>{p.push('d'+(i+1));if(i<C.segs.length-1)p.push('e'+(i+1));});if(!C.noHood)p.push('hood');if(C.booster)p.push('booster');if(C.trap)p.push('trap');return p;};
const devLen=C=>C.straight+C.elbows*5;
const rowFor=L=>Math.min(50,Math.max(10,Math.round(L/10)*10));
function expected(C){
  if(C.term==='none')return {result:'none'};
  const L=devLen(C),tb=C.term==='roof'?T410:T49,row=tb.find(r=>r[0]===rowFor(L)),v=Math.max(...C.vel);
  return {L,row,result:C.gauge<row[1]&&v>=row[2]?'pass':'fail',pOk:C.gauge<row[1],vOk:v>=row[2],v};
}
// ---------- state ----------
const $=id=>document.getElementById(id),svg=$('svg'),NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let C,S,step='inspect',sel=null,MSG=null;
const STEPS=[['inspect','1 Inspect'],['clean','2 Clean'],['length','3 Length'],['test','4 Test'],['call','5 Call']];
function fresh(){return {seen:{},codes:[],clean:null,len:'',table:null,dev:null,tap:null,energized:false,waited:false,reads:{},recorded:null,result:null,recs:[],testBeforeClean:false};}
const say=(t,s)=>{MSG={t,s};};
function obs(id){const o=C.obs[id];if(o)return Object.assign({issue:!!((o.code&&o.code.length)||o.lint)},o);
  if(id==='dryer')return {t:'Electric dryer, pulled out from the wall. Lint screen cleaned by the owner.'};
  if(id==='port')return {t:'4 in port, collar tight to the drywall.'};
  if(id[0]==='d')return {t:D+' '+C.segs[+id.slice(1)-1]+' section.'};
  if(id[0]==='e')return {t:'Hard 90 degree elbow, mitered.'};
  if(id==='hood')return {t:'Hood flap swings free, barrier clear.'};
  return {t:'Checked.'};}
function pname(id){return {dryer:'Dryer',trans:'Transition duct',port:'Wall port and connection',hood:C.term==='roof'?'Roof cap':'Wall hood',booster:'Booster fan',trap:'Secondary lint trap'}[id]||(id[0]==='d'?'Duct section '+id.slice(1):'Elbow '+id.slice(1));}
function reading(where){ // the gauge reads high and velocity low if the booster has not engaged yet
  if(C.gauge==null)return null;const early=C.booster&&!S.waited;
  if(where==='gauge')return early?Math.round((C.gauge+.45)*100)/100:(S.tap==='mid'?C.gauge:Math.round((C.gauge-.12)*100)/100);
  const i={top:0,bottom:1,side:2}[where];return early?C.vel[i]-420:C.vel[i];}
// ---------- drawing ----------
function draw(){
  svg.innerHTML='';const P=C.path,roof=C.term==='roof'||C.term==='none';
  el('rect',{x:0,y:0,width:800,height:460,fill:'#f7fafc'});
  el('path',{d:'M40 430 L40 230 L300 60 L560 230 L560 430',fill:'#fff',stroke:'#9fb3c3','stroke-width':3});
  el('line',{x1:40,y1:230,x2:560,y2:230,stroke:'#c9d6df','stroke-width':2});el('text',{x:60,y:250,class:'lbl'}).textContent='attic';
  if(C.path[0][1]>300)el('line',{x1:40,y1:330,x2:560,y2:330,stroke:'#eef3f6','stroke-width':1});

function grade(){
  const E=expected(C),out=[];let score=100;const hit=(ok,g,b,why,pen)=>{out.push({ok,t:ok?g:b,why});if(!ok)score-=pen;};
  const list=parts(C),miss=list.filter(p=>!S.seen[p]);
  for(const k of['trans','port','hood','booster','trap'])if(list.includes(k)&&!S.seen[k]){const why={trans:'DEDP 1.2.1 and 1.9: the transition has to be accessible and checked against code.',port:'DEDP 1.2.2: the transition connection to the permanent duct.',hood:'DEDP 1.2.3 and 1.3.4 to 1.3.5: the termination device and its barrier.',booster:'DEDP 1.6: determine if a booster fan is present and working before the test.',trap:'DEDP 1.7: determine if a secondary lint trap is present and clean before the test.'}[k];hit(false,'','Never looked at the '+pname(k).toLowerCase()+'.',why,8);}

  for(const c of S.codes)if(!want.has(c)){out.push({ok:false,t:'Code call you cannot back up: '+CODE[c][0].toLowerCase()+'.',why:'Nothing you inspected shows it.'});score-=4;}

    hit(S.table===C.term,C.term==='roof'?'Used the roof top table.':'Used the side wall table.','Wrong performance table.','DEDP 1.8.4 and 4.6.1: the termination location picks the table. Roof and side wall share velocity minimums, not pressure limits.',10);
    hit(!S.testBeforeClean,'Tested only after cleaning.','Ran the test before the run was cleaned.','DEDP 3.0.1: the test is for duct that is inspected and confirmed clean.',8);
    hit(S.dev==='dedp','Tested with the DEDP blower.',S.dev?'Tested on the dryer blower.':'Never picked a test blower.','DEDP 3.0.2: the test shall never use the dryer blower.',15);
    hit(S.tap==='mid','Tap halfway on the test duct, top or outside bend.','Pressure tap in the wrong spot.','DEDP 3.1.2: the tap goes halfway along the test duct, on top or on the outside of a bend.',6);
    if(C.booster)hit(S.waited,'Waited for the booster switch before reading.','Read the gauge before the booster fan kicked on.','DEDP 3.1.6.1: give the booster pressure switch 30 seconds to a minute to engage.',8);
    hit(Object.keys(S.reads).length===3,'Three velocity readings at the termination.','Fewer than three velocity readings.','DEDP 3.2.1.1: at least three readings in different spots, like top, bottom, and side.',4);
    hit(S.recorded===E.v&&(!C.booster||S.waited),`Recorded the maximum, ${E.v} fpm.`,'Recorded the wrong velocity.','DEDP 3.2.1.1 and 4.3: record the highest reading found.',8);

    hit(!S.energized,'Did not try to test a run with no termination.','Tried to test a run with no termination.','DEDP 1.2.3 and 1.3.4: there is no termination device to test at. 1.3.7 recommends the test not proceed until the condition is remedied or reported.',6);
  }

  const next=CASES.find(c=>c.id===C.id+1);
  $('report').innerHTML=`<p class="eyebrow">Job ${C.id} · ${esc(C.title)} · graded against the DEDP and the IRC</p><div class="big">${G.score}<span style="font-size:1.2rem;color:#5d7282"> / 100</span></div><ul class="rep">${G.out.map(r=>`<li class="${r.ok?'':'bad'}">${esc(r.t)}<span>${esc(r.why)}</span></li>`).join('')}</ul>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${next?`<button type="button" class="btn" id="next">Job ${next.id}: ${esc(next.title)}</button>`:''}<button type="button" class="btn alt" id="retry">Run this job again</button><button type="button" class="btn alt" id="close">Back to the job</button></div>`;
  if(next)$('next').onclick=()=>{FT.closeOver();load(next.id);};$('retry').onclick=()=>{FT.closeOver();load(C.id);};$('close').onclick=()=>{FT.closeOver();};
  FT.openOver($('submit'),$('next')||$('retry'));
};
// The right way through each job, used by the self-test.
function solve(id){load(id);const E=expected(C);parts(C).forEach(p=>{S.seen[p]=obs(p);});
  const want=new Set();Object.values(C.obs).forEach(o=>(o.code||[]).forEach(c=>want.add(c)));S.codes=[...want];
  if(C.term==='none'){S.clean='hold';S.result='none';S.recs=C.recs.slice();return grade();}
  S.clean='clean';S.len=String(devLen(C));S.table=C.term;S.dev='dedp';S.tap='mid';S.energized=true;if(C.booster)S.waited=true;
  for(const w of['top','bottom','side'])S.reads[w]=reading(w);S.recorded=Math.max(...Object.values(S.reads));S.result=E.result;S.recs=C.recs.slice();return grade();}
window.__VENT={get S(){return S},get C(){return C},load,grade,expected,solve,reading,CASES};
// ---------- keep the job if you leave ----------
const RUN=FT.run('vent-call');let booted=false;
function dirty(){return !!(S&&(Object.keys(S.seen).length||S.codes.length||S.clean||S.len||S.table||S.dev||S.tap||S.result||S.recs.length));}
function persist(){if(booted&&dirty())RUN.save({c:C.id,S,step});}
load(1);booted=true;
(function(){const sv=RUN.load(),d=sv&&sv.d,c=d&&CASES.find(x=>x.id===d.c);if(!c||!d.S||!d.S.seen||!Array.isArray(d.S.codes)||!Array.isArray(d.S.recs)||!d.S.reads)return;
  const n=STEPS.filter(([k])=>{const keep=[C,S];C=c;S=d.S;let r=false;try{r=done(k);}catch(e){}[C,S]=keep;return r;}).length;
  FT.offerResume({run:RUN,at:sv.at,text:`Job ${c.id}, ${c.title}: ${n} of 5 steps done.`,
    resume(){C=c;S=d.S;step=STEPS.some(([k])=>k===d.step)?d.step:'inspect';sel=null;say('Back on the job.','Everything you checked and wrote is still here.');update();}});})();
</script>
