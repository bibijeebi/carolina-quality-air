<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attic Job: residential duct cleaning sim</title>
<meta name="description" content="Residential attic duct cleaning job. Tool belt, real rod reach, visible airflow, and the lead's grade out of 100.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1c2b36;--muted:#5d7282;--paper:#eef3f7;--sheet:#fff;--line:#d3dee6;--blue:#007cba;--blue-soft:#dcedf7;--rust:#b5452f;--gold:#e8a917;--gold-soft:#fff3cf;--green:#2e8b57;--green-soft:#e1f2e8;--red:#c0392b;--red-soft:#fbe4e1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
#app{max-width:1320px;margin:0 auto;padding:8px 10px 16px;display:grid;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px 10px}
.home{font-weight:700;color:var(--blue);text-decoration:none;font-size:.85rem;border:1px solid #b7cad7;border-radius:3px;padding:6px 10px;min-height:36px;display:inline-flex;align-items:center}
.home:hover{background:var(--blue-soft)}
.bar h1{font-family:'Hind Madurai',Jost,sans-serif;font-size:1.15rem;margin:0;letter-spacing:.03em;text-transform:uppercase;color:var(--blue)}
.stat{font-size:.82rem;color:var(--muted);display:flex;gap:5px;align-items:center}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.stat b.on{color:var(--green)}.stat b.off{color:var(--red)}
.meter{width:56px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);transition:width .3s}
.bar .stats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.bar .acts{display:flex;gap:8px;margin-left:auto}
@media (max-width:700px){.bar .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px 10px;width:100%}.bar .acts{width:100%;margin-left:0}.bar .acts .btn{flex:1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;min-height:34px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:3px;padding:6px 12px;min-height:36px;font-weight:600;cursor:pointer}
.btn.alt{background:#fff;color:var(--blue);border-color:#b7cad7}
.btn:disabled{opacity:.4;cursor:default}
.scene{background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.belt{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.tool{flex:0 0 auto;border:2px solid #b7cad7;background:#fff;border-radius:6px;padding:5px 9px;min-height:50px;min-width:88px;cursor:pointer;text-align:left;line-height:1.15}
.tool b{display:block;font-size:.88rem}.tool small{color:var(--muted);font-size:.72rem}
.tool kbd{float:right;font-size:.65rem;color:#9fb3c3;font-family:inherit;margin-left:6px}
.tool.on{border-color:var(--gold);background:var(--gold-soft)}
.lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:8px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 12px;min-width:0}
.msg{min-height:3.2em}.msg b{display:block}.msg b.bad{color:var(--red)}.msg b.good{color:var(--green)}.msg span{color:var(--muted);font-size:.86rem;display:block}
.who{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.prev{margin-top:6px;font-size:.84rem;border-left:3px solid var(--gold);padding:3px 0 3px 9px;display:none}
.prev.show{display:block}.prev .bad{color:var(--red);font-weight:600}.prev .good{color:var(--green);font-weight:600}
.choices{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.picks{display:flex;flex-wrap:wrap;gap:5px}
.pick{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:.78rem;cursor:pointer;min-height:32px}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 5px}
details summary{cursor:pointer;font-weight:600;font-size:.88rem}
.log{max-height:170px;overflow:auto;font-size:.8rem;margin:6px 0 0;padding-left:20px;color:var(--muted)}.log li.f{color:var(--red)}
#over{position:fixed;inset:0;background:#1c2b36cc;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:22px 12px;z-index:9}
#over .card{max-width:780px;width:100%}
.big{font-family:'Hind Madurai',Jost,sans-serif;font-size:3rem;font-weight:700;color:var(--blue);line-height:1}
table.g{border-collapse:collapse;width:100%;font-size:.86rem;margin:10px 0}
table.g td{border-bottom:1px solid var(--line);padding:5px 6px}table.g td:nth-child(2){font-weight:700;white-space:nowrap}
.rep{list-style:none;padding:0;margin:8px 0}.rep li{padding:6px 10px;margin:4px 0;border-left:4px solid var(--red);background:var(--red-soft);font-size:.86rem}.rep li span{display:block;color:var(--muted);font-size:.8rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cols ol{padding-left:20px;margin:6px 0;font-size:.8rem}
.hit{fill:transparent;stroke:transparent;cursor:pointer}
.rot{display:none;margin:0;font-size:.8rem;color:#5d7282}
@media (max-width:700px) and (orientation:portrait){.rot{display:block}}
.lbl{font-size:13px;fill:#5d7282;pointer-events:none;font-family:Jost,sans-serif}
.pct{font-size:11px;fill:#fff;font-weight:700;pointer-events:none;paint-order:stroke;stroke:#3a2a1a;stroke-width:3px}
.room{font-size:12px;letter-spacing:.12em;fill:#8aa0b0;font-weight:600;pointer-events:none}
.flow{fill:none;stroke-width:4;stroke-dasharray:9 8;animation:dash .8s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-17}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
@media (max-width:650px){.belt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tool{min-width:0;padding:5px 6px;min-height:46px}.tool b{font-size:.8rem}.tool small{font-size:.68rem}.tool kbd{display:none}}
@media (max-width:860px){.lower{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.scene{position:sticky;top:0;z-index:3;box-shadow:0 4px 10px #1c2b3620}}
/* field kit: shared with the lab shell */
:root{color-scheme:light}
:focus-visible{outline:3px solid #c48000;outline-offset:3px}
:focus:not(:focus-visible){outline:none}
.seg button:focus-visible,.tabs button:focus-visible,.tab:focus-visible,.step:focus-visible{outline-offset:-3px}
.in-frame .bar>a.home,.in-frame .bar>h1,.in-frame .wrap>a.home,.in-frame .wrap>h1{position:absolute!important;width:1px;height:1px;margin:0;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.in-frame .scene,.in-frame .plan{position:relative!important;top:auto!important;box-shadow:none!important}
.in-frame #over{padding-top:12px}
.resume{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:#e8f3fa;border:1px solid #9bbfd5;border-left:4px solid #007cba;border-radius:3px;padding:10px 12px}
.resume-txt b{display:block}.resume-txt span{display:block;font-size:.85rem;color:#526878}
.resume-acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
<script>
/* Field training frame kit: framing, auto height, report dialog, saved runs. Same block in every field/*.html. */
(function(){
  var root=document.documentElement,framed=false;
  try{framed=window.parent!==window&&window.parent.location.origin===location.origin;}catch(e){framed=false;}
  if(framed)root.classList.add('in-frame');
  var FT=window.FT={framed:framed,banner:null};
  function post(m){if(framed){try{window.parent.postMessage(m,location.origin);}catch(e){}}}
  FT.post=post;
  var lastH=0,over=function(){return document.getElementById('over');};
  function size(){
    if(!framed)return;
    var h=Math.ceil(root.getBoundingClientRect().height),o=over();
    if(o&&o.style.display&&o.style.display!=='none'&&o.firstElementChild)h=Math.max(h,Math.ceil(o.firstElementChild.getBoundingClientRect().height)+60);
    if(h!==lastH){lastH=h;post({vel:'field-size',h:h});}
  }
  FT.size=size;
  document.addEventListener('DOMContentLoaded',function(){
    if(framed){
      // The lab shell shows the title and the way back; keep ours out of the tab order and the reading order.
      document.querySelectorAll('.bar > a.home, .wrap > a.home').forEach(function(a){a.setAttribute('tabindex','-1');a.setAttribute('aria-hidden','true');});
      if('ResizeObserver' in window){var ro=new ResizeObserver(size);ro.observe(root);var o=over();if(o&&o.firstElementChild)ro.observe(o.firstElementChild);}
      window.addEventListener('load',size);size();
    } else {
      document.querySelectorAll('a[target="_top"]').forEach(function(a){if(a.dataset.solo)a.setAttribute('href',a.dataset.solo);a.removeAttribute('target');});
    }
  });
  // ---- the report dialog ----
  var ret=null;
  function focusables(o){return Array.prototype.filter.call(o.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'),function(e){return e.getClientRects().length>0;});}
  function trap(e){
    var o=over();if(!o||o.style.display==='none')return;
    e.stopPropagation(); // tool shortcuts stay off while the report is up; default actions still run
    if(e.key==='Escape'){e.preventDefault();FT.closeOver();return;}
    if(e.key!=='Tab')return;
    var f=focusables(o);if(!f.length){e.preventDefault();return;}
    var a=f[0],z=f[f.length-1],cur=document.activeElement;
    if(!o.contains(cur)){e.preventDefault();a.focus();}
    else if(e.shiftKey&&cur===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus();}
  }
  FT.openOver=function(back,first){
    var o=over(),app=document.getElementById('app');ret=back||null;
    o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
    var h=o.querySelector('.big');if(h){h.id=h.id||'report-score';o.setAttribute('aria-labelledby',h.id);}
    o.style.display='flex';o.scrollTop=0;if(app)app.inert=true;
    document.addEventListener('keydown',trap,true);
    var f=first||focusables(o)[0];if(f)f.focus({preventScroll:true});
    if(framed){post({vel:'field-overlay'});size();}
  };
  FT.closeOver=function(){
    var o=over(),app=document.getElementById('app');
    o.style.display='none';if(app)app.inert=false;
    document.removeEventListener('keydown',trap,true);
    if(ret&&document.contains(ret)){try{ret.focus();}catch(e){}}
    size();
  };
  // ---- saved runs: one key per tool, versioned ----
  FT.run=function(tool){
    var K='vel-field-run-'+tool;
    return {
      load:function(){try{var v=JSON.parse(localStorage.getItem(K)||'null');return v&&v.v===1&&v.d&&typeof v.d==='object'&&!Array.isArray(v.d)?v:null;}catch(e){return null;}},
      save:function(d){try{localStorage.setItem(K,JSON.stringify({v:1,at:Date.now(),d:d}));}catch(e){}if(FT.banner){FT.banner.remove();FT.banner=null;size();}},
      clear:function(){try{localStorage.removeItem(K);}catch(e){}if(FT.banner){FT.banner.remove();FT.banner=null;size();}}
    };
  };
  FT.offerResume=function(o){
    var b=document.createElement('div'),when='';
    try{when=new Date(o.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){}
    b.className='resume';b.setAttribute('role','region');b.setAttribute('aria-label','Saved job');
    b.innerHTML='<div class="resume-txt"><b>You have a job in progress.</b><span></span></div><div class="resume-acts"><button type="button" class="btn">Resume your job</button><button type="button" class="btn alt">Start a new one</button></div>';
    b.querySelector('span').textContent=o.text+(when?' Saved '+when+'.':'');
    var bs=b.querySelectorAll('button');
    bs[0].onclick=function(){b.remove();FT.banner=null;try{o.resume();}catch(e){o.run.clear();}size();};
    bs[1].onclick=function(){o.run.clear();if(o.fresh)o.fresh();size();};
    var bar=document.querySelector('#app > .bar');if(bar)bar.after(b);else document.body.prepend(b);
    FT.banner=b;
  };
  // Scores for the hub: vel-field is {tool:{n,best,last,at}}; anything else is replaced.
  FT.record=function(tool,score){
    try{var K='vel-field',m={};try{var v=JSON.parse(localStorage.getItem(K)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))m=v;}catch(e){}
      var r=m[tool]&&typeof m[tool]==='object'?m[tool]:{};var n=Number.isFinite(r.n)?r.n:0,best=Number.isFinite(r.best)?r.best:0;
      m[tool]={n:n+1,best:Math.max(best,score),last:score,at:Date.now()};localStorage.setItem(K,JSON.stringify(m));}catch(e){}
    post({vel:'field',tool:tool});
  };
})();
</script>
</head>
<body>
<div id="app">
  <div class="bar">
    <a class="home" href="../#/field" target="_top">&larr; Field training</a>
    <h1>Attic Job</h1>
    <div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="learn" class="on">Learn</button><button type="button" data-mode="test">Test</button></div>
    <div class="stats">
    <span class="stat">Clock <b id="clock">0:00</b></span>
    <span class="stat">System <b id="sys">ON</b></span>
    <span class="stat">Vac <b id="vac">off</b></span>
    <span class="stat">Return <span class="meter"><i id="m-ret"></i></span></span>
    <span class="stat">Supply <span class="meter"><i id="m-sup"></i></span></span>
    <span class="stat">Flags <b id="flags">0</b></span>
    </div>
    <div class="acts">
    <button type="button" class="btn alt" id="undo">Undo</button>
    <button type="button" class="btn" id="finish">Finish job</button>
    </div>
  </div>
  <div class="scene"><svg id="svg" viewBox="0 170 1300 530" role="img" aria-label="Cutaway of a house with the attic duct system"></svg></div>
  <p class="rot" id="rot">Turn your phone sideways for a bigger view of the attic.</p>
  <div class="belt" id="belt" role="toolbar" aria-label="Tool belt"></div>
  <div class="lower">
    <div class="card"><div class="who" id="who">Lead</div><div class="msg" id="msg" role="status" aria-live="polite"></div><div class="prev" id="prev"></div><div class="choices" id="choices"></div></div>
    <div class="card"><p class="eyebrow">Tap a spot, or pick it here</p><div class="picks" id="picks"></div><details style="margin-top:8px"><summary>Job log</summary><ol class="log" id="log"></ol></details></div>
  </div>
</div>
<div id="over"><div class="card" id="report"></div></div>
<script>
'use strict';
// ---------- the house (local coords; the house group is shifted right to make room for the van) ----------
const OX=110;
const Q=(x0,y0,cx,cy,x1,y1)=>{const o=[];for(let i=0;i<=14;i++){const t=i/14,a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;o.push([a*x0+b*cx+c*x1,a*y0+b*cy+c*y1]);}return o;};
const TY=360,TH=26;
const SEG={
  RP:{side:'return',kind:'plenum',mat:'metal',label:'return plenum',up:null,r:[420,346,50,56]},
  R1:{side:'return',kind:'trunk',label:'near return trunk',up:'RP',r:[350,TY,70,TH]},
  R2:{side:'return',kind:'trunk',label:'far return trunk',up:'R1',r:[276,TY,74,TH]},
  bLR:{side:'return',kind:'flex',label:'living room return flex',up:'R1',p:Q(386,386,380,404,396,420),reg:'LR'},
  SP:{side:'supply',kind:'plenum',mat:'board',label:'supply plenum',up:null,r:[540,346,50,56]},
  T1:{side:'supply',kind:'trunk',label:'supply trunk 1',up:'SP',r:[590,TY,90,TH]},
  T2:{side:'supply',kind:'trunk',label:'supply trunk 2',up:'T1',r:[680,TY,90,TH]},
  T3:{side:'supply',kind:'trunk',label:'supply trunk 3',up:'T2',r:[770,TY,90,TH]},
  T4:{side:'supply',kind:'trunk',label:'supply trunk 4',up:'T3',r:[860,TY,90,TH]},
  T5:{side:'supply',kind:'trunk',label:'supply trunk 5, end cap',up:'T4',r:[950,TY,80,TH]},
  bA:{side:'supply',kind:'flex',label:'kitchen flex',up:'T1',p:Q(626,386,616,406,640,420),reg:'A'},
  bBa:{side:'supply',kind:'flex',label:'bath flex',up:'T2',p:Q(726,386,748,404,742,420),reg:'Ba'},
  bB:{side:'supply',kind:'flex',label:'bedroom B flex',up:'T4',p:Q(906,386,884,404,882,420),reg:'B'},
  bC:{side:'supply',kind:'flex',label:'bedroom C flex, off the end cap',up:'T5',p:Q(1030,373,1070,378,1082,420),reg:'C'}
};
for(const k in SEG){const s=SEG[k];if(s.r){const[x,y,w,h]=s.r;s.c=[x+w/2,y+h/2];s.a=s.kind==='plenum'?[x+w/2,y+h/2]:(s.side==='supply'?[x,y+h/2]:[x+w,y+h/2]);}else{s.c=s.p[7];s.a=s.p[0];}}
const REG={
  RG:{seg:'R2',name:'hallway return grille',soil:'caked',x:292,room:'hallway'},
  LR:{seg:'bLR',name:'living room return',soil:'light',x:396,room:'living room'},
  A:{seg:'bA',name:'kitchen supply',soil:'greasy',x:640,room:'kitchen'},
  Ba:{seg:'bBa',name:'bath supply',soil:'light',x:742,room:'bath'},
  B:{seg:'bB',name:'bedroom B supply',soil:'caked',x:882,room:'bedroom B'},
  C:{seg:'bC',name:'bedroom C supply',soil:'caked',x:1082,room:'bedroom C'}
};
const SOIL={light:{txt:'light dust',rag:1,hose:1,pw:1},caked:{txt:'caked dust packed into the fins',rag:.5,hose:1,pw:1},greasy:{txt:'greasy film from kitchen air',rag:.2,hose:.4,pw:1}};
// Reach from each way in. Hard rod: straight metal, stacks about four sections. Soda rod: coils through flex and around the 90 at a takeoff.
const REACH={
  RP:{hard:['RP','R1','R2']}, SP:{hard:['SP','T1','T2','T3']},
  RG:{hard:['R2','R1']}, LR:{soda:['bLR','R1']},
  A:{soda:['bA','T1']}, Ba:{soda:['bBa','T2']}, B:{soda:['bB','T4']}, C:{soda:['bC','T5']},
  'h:R1':{hard:['R1','R2']},'h:R2':{hard:['R2','R1']},'h:T1':{hard:['T1','T2']},'h:T2':{hard:['T2','T3']},'h:T3':{hard:['T3','T4']},'h:T4':{hard:['T4','T5']},'h:T5':{hard:['T5','T4']}
};
const MIN_HOLES=2;
const RUN=FT.run('attic-job');
const COST={walk:8,tstat:1,ah:20,cut8:6,hook:3,unhook:2,tie:1,mach:1,bit:2,plug:2,patch_metal:8,patch_fsk:4,pull:1,wash_rag:3,wash_hose:5,wash_pw:7,reinstall:1,zip:1,whip:3,fwd:2};
const HATCH=[190,420],MACH=[190,610],TSTAT=[300,540];

// ---------- engine: pure over state, so previews are a run on a copy ----------
function rng(seed){let s=seed%2147483647||1;return()=>(s=s*16807%2147483647)/2147483647;}
function fresh(seed){const r=rng(seed||7),S={seg:{},reg:{},holes:{},hose:null,tied:false,mach:false,power:true,walked:false,ah:false,min:0,vio:[],def:[],log:[],fx:[],house:0,retDone:null,supStart:null,torn:[]};
  for(const k in SEG)S.seg[k]={g:74+Math.floor(r()*22),l:0};for(const k in REG)S.reg[k]={on:true,dirt:65+Math.floor(r()*28),zip:true};return S;}
const copy=S=>JSON.parse(JSON.stringify(S));
const clean=(S,k)=>S.seg[k].g<8&&S.seg[k].l<8;
const sideSegs=s=>Object.keys(SEG).filter(k=>SEG[k].side===s);
const sideClean=(S,s)=>sideSegs(s).every(k=>clean(S,k));
const negOn=(S,side)=>S.mach&&S.hose&&SEG[S.hose].side===side;
const upChain=k=>{const o=[];let c=SEG[k].up;while(c){o.push(c);c=SEG[c].up;}return o;};
const names=ks=>ks.map(k=>SEG[k].label).join(', ');
function flag(S,code,text,why){if(S.vio.some(v=>v.code===code))return;S.vio.push({code,text,why});S.log.push({t:text,f:1});}
const entryName=e=>REG[e]?'the '+REG[e].name+' boot':e.startsWith('h:')?'the bit hole in '+SEG[e.slice(2)].label:'the '+SEG[e].label+' access';
const entrySide=e=>SEG[(REACH[e].hard||REACH[e].soda)[0]].side;

document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const n=e.key==='0'?9:+e.key-1;if(n>=0&&n<TOOLS.length&&/^[0-9]$/.test(e.key)){tool=TOOLS[n][0];armed=null;render();}if(e.key==='z'&&mode==='learn')undo();});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode===mode)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));restart(mode==='test'?'Test mode: no previews of what the lead flags, no undo, no dirt numbers. Graded at the end.':'Learn mode: every tap shows what it reaches, where the dust goes, and what the lead would flag.');});
function undo(){if(mode==='test'||!hist.length||busy)return;S=hist.pop();armed=null;choices=null;render();persist();}
$('undo').onclick=undo;
function restart(note){RUN.clear();S=fresh(Date.now()%100000);hist=[];armed=null;choices=null;hover=null;worker={x:G(MACH)[0]+60,y:640,tx:0,ty:0};S.say=note?{t:'New job.',s:note}:null;render();}
$('finish').onclick=finish;
function finish(){
  const Gr=grade(S),li=(t,w)=>`<li>${esc(t)}${w?`<span>${esc(w)}</span>`:''}</li>`;
  FT.record('attic-job',Gr.score);RUN.clear();
  $('report').innerHTML=`<p class="eyebrow">${mode==='test'?'Test':'Learn'} mode · the lead's grade</p><div class="big">${Gr.score}<span style="font-size:1.2rem;color:#5d7282"> / 100</span></div><p style="color:#5d7282;margin:.3em 0">${fmt(S.min)} on the clock. The lead's order takes ${fmt(par.min)}.</p>
  <table class="g">${Gr.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} / ${r[2]}</td><td>${esc(r[3])}</td></tr>`).join('')}</table>
  ${S.vio.length||S.def.length||S.house>1?`<p class="eyebrow">What the lead saw</p><ul class="rep">${S.vio.map(v=>li(v.text,v.why)).join('')}${S.def.map(d=>li(d)).join('')}${S.house>1?li('Dust pushed into the house.','That happens when you whip or forward with nothing pulling on that side.'):''}</ul>`:'<p><b>Clean job. No notes.</b></p>'}
  <div class="cols"><div><p class="eyebrow">What you did</p><ol>${S.log.map(l=>`<li${l.f?' style="color:#c0392b"':''}>${l.f?'Flag: ':''}${esc(l.t)}</li>`).join('')||'<li>Nothing yet.</li>'}</ol></div><div><p class="eyebrow">The lead's order</p><ol>${par.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn" id="again">Run a new job</button><button type="button" class="btn alt" id="back">Back to this job</button><a class="home" href="../#/field" target="_top">&larr; Field training</a></div>`;
  $('again').onclick=()=>{FT.closeOver();restart();};$('back').onclick=()=>{FT.closeOver();persist();};FT.openOver($('finish'),$('again'));
}
const narrow=matchMedia('(max-width:700px)');const fit=()=>svg.setAttribute('viewBox',narrow.matches?'250 236 1050 420':'0 170 1300 530');fit();narrow.addEventListener('change',fit);
window.__AJ={get S(){return S},act,resolve,grade,PAR,par,commit:(a)=>{act(S,a);render();persist();},fresh,tapTarget,setTool:t=>{tool=t;render();}};
worker={x:G(MACH)[0]+60,y:640,tx:0,ty:0};render();
// ---------- keep the job if you leave ----------
function persist(){if(S.log.length)RUN.save({S,mode,tool});}
(function(){const sv=RUN.load(),d=sv&&sv.d;if(!d||!d.S||!Array.isArray(d.S.log)||!d.S.log.length||!d.S.seg)return;
  FT.offerResume({run:RUN,at:sv.at,text:`${d.S.log.length} move${d.S.log.length===1?'':'s'}, ${fmt(d.S.min||0)} on the clock, ${d.mode==='test'?'Test':'Learn'} mode.`,
    resume(){mode=d.mode==='test'?'test':'learn';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));S=d.S;hist=[];armed=null;choices=null;hover=null;if(TOOLS.some(x=>x[0]===d.tool))tool=d.tool;S.say={t:'Back on the job.',s:'Undo history starts fresh from here.'};render();}});})();
</script>
</body>
