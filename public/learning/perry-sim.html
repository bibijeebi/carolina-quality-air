<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duct Duct Sales Club!</title>
<meta property="og:title" content="Duct Duct Sales Club!">
<meta property="og:description" content="A CQA visual novel. Learn to walk the job, win the customer, and price like Perry.">
<meta property="og:url" content="https://carolinaqualityair.xyz/learning/perry-sim.html">
<meta name="twitter:card" content="summary">
<style>
:root{--pk:#ffbde1;--pk2:#ff8fcb;--pkd:#b8407e;--cream:#fff6fa;--ink:#4a2b3a;--box:#fff0f7;--line:#f3a8d0;--ok:#2e7d32;--bad:#c62828;--gold:#b26a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;height:100%}
body{margin:0;font:16px/1.5 "Segoe UI",-apple-system,Roboto,sans-serif;background:#2a1420;color:var(--ink);user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#bg{position:absolute;inset:0;transition:background 1s}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 40%,rgba(40,10,30,.25))}
.bg-menu{background:linear-gradient(160deg,#ffd3ec,#ffb0d8 45%,#f78fc2)}
.bg-office{background:linear-gradient(#e8f2fb 60%,#cdd9e4 60.5%)}
.bg-closet{background:linear-gradient(#d8d3cc 65%,#a99f93 65.5%)}
.bg-cqa{background:linear-gradient(#fdf3e3 60%,#e5cfa8 60.5%)}
.bg-duct{background:linear-gradient(#b8bfc7 55%,#7d858e 55.5%)}
.bg-night{background:linear-gradient(#2b2340,#4a3560)}
#sprite{position:absolute;bottom:24vh;left:50%;transform:translateX(-50%);width:min(52vw,240px);transition:opacity .35s,transform .35s;filter:drop-shadow(0 8px 16px rgba(60,10,40,.25))}
#sprite.hop{animation:hop .35s}
@keyframes hop{40%{transform:translateX(-50%) translateY(-14px)}}
#sprite.hidden{opacity:0}
#ui{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
#namep{display:inline-block;background:var(--pk2);color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;padding:3px 16px;border-radius:10px 10px 0 0;margin-left:14px;text-shadow:0 1px 0 var(--pkd)}
#tbox{background:var(--box);border:3px solid var(--line);border-radius:14px;min-height:108px;padding:12px 16px 14px;font-size:16.5px;box-shadow:0 6px 20px rgba(60,10,40,.35);position:relative}
#tbox .arrow{position:absolute;right:14px;bottom:8px;color:var(--pk2);font-size:18px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#choices{position:absolute;left:0;right:0;bottom:0;top:0;display:none;flex-direction:column;justify-content:center;gap:10px;padding:16px;background:rgba(50,15,35,.45);backdrop-filter:blur(2px)}
#choices button{font:inherit;font-weight:700;background:var(--cream);border:3px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-align:left;box-shadow:0 4px 0 var(--line)}
#choices button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;font-size:12px}
.meter{flex:1;background:rgba(255,255,255,.75);border:2px solid var(--line);border-radius:10px;padding:3px 8px}
.meter b{font-size:11px;letter-spacing:.5px}
.bar{height:7px;background:#f6d7e8;border-radius:5px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
#trustbar i{background:linear-gradient(90deg,#ff8fcb,#e91e8c)}
#marginbar i{background:linear-gradient(90deg,#8fd3ff,#1e88e5)}
#chapcard{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#ffd3ec,#f78fc2);text-align:center;padding:24px;z-index:5}
#chapcard h2{font-size:15px;letter-spacing:3px;color:var(--pkd);margin:0}
#chapcard h1{font-size:30px;margin:8px 0 4px;color:#7a2454;letter-spacing:-.5px}
#chapcard p{color:#8a4a6c;max-width:340px;font-size:14.5px}
.heart{font-size:34px;animation:spin 3s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(50,15,35,.5);z-index:6;padding:14px}
#panel .card{background:var(--cream);border:3px solid var(--line);border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:86vh;overflow-y:auto}
#panel h3{margin:0 0 6px;color:var(--pkd)}
#panel p{font-size:14.5px;margin:6px 0}
.wgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.wgrid button{font:inherit;font-size:14.5px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--ink)}
.wgrid button.sel{background:var(--pk2);color:#fff;border-color:var(--pkd)}
.est label{display:block;font-size:13.5px;font-weight:700;margin:10px 0 3px;color:var(--pkd)}
.est input[type=number]{font:inherit;width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:9px;background:#fff}
.est .row{display:flex;gap:8px;align-items:center;font-size:14.5px;margin:7px 0}
.est .row input{width:20px;height:20px}
.go{font:inherit;font-weight:800;width:100%;margin-top:12px;background:var(--pk2);color:#fff;border:0;border-radius:11px;padding:12px;box-shadow:0 4px 0 var(--pkd)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pkd)}
#menu{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#ffd3ec,#ffb0d8 45%,#f78fc2);text-align:center;padding:20px}
#menu h1{font-size:40px;margin:0;color:#7a2454;letter-spacing:-1px;text-shadow:2px 2px 0 #fff}
#menu .sub{color:#a04a78;font-weight:700;margin:2px 0 26px}
#menu button{font:inherit;font-weight:800;font-size:17px;background:#fff;color:var(--pkd);border:3px solid #fff;border-radius:13px;padding:12px 34px;margin:6px;box-shadow:0 5px 0 rgba(184,64,126,.5)}
#menu button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(184,64,126,.5)}
#menu .tiny{font-size:11.5px;color:#a04a78;margin-top:22px;max-width:320px}
.fb{border-left:4px solid var(--gold);background:#fff8ec;border-radius:7px;padding:8px 11px;margin:8px 0;font-size:13.5px}
.fb.good{border-color:var(--ok);background:#eef7ee}
.fb.bad{border-color:var(--bad);background:#fdeeee}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;transition:opacity .12s}

#decor{position:absolute;inset:0;pointer-events:none}
#decor svg{position:absolute;inset:0;width:100%;height:100%}
#sndbtn{background:rgba(255,255,255,.75);border:2px solid var(--line);border-radius:10px;font-size:15px;padding:2px 8px}
.floatp{position:absolute;top:34px;font-size:13px;font-weight:800;pointer-events:none;animation:rise 1.1s forwards}
@keyframes rise{to{transform:translateY(-26px);opacity:0}}
.mheart{position:absolute;font-size:22px;pointer-events:none;animation:drift linear infinite;opacity:.55}
@keyframes drift{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-10vh) rotate(340deg)}}
#estTotal{font-size:16px;font-weight:800;color:var(--pkd);margin-top:10px;text-align:center;background:#fff;border:2px dashed var(--line);border-radius:9px;padding:7px}
body{touch-action:manipulation}
</style>
</head>

<div id="stage">
<div id="bg" class="bg-menu"></div>
<div id="decor"></div>
<img id="sprite" class="hidden" alt="">
<div id="hud" style="display:none">
<div class="meter"><b>💗 TRUST</b><div class="bar" id="trustbar"><i style="width:50%"></i></div></div>
<div class="meter"><b>💰 MARGIN</b><div class="bar" id="marginbar"><i style="width:50%"></i></div></div>
<button id="sndbtn" onclick="toggleSnd(event)">🔊</button>
</div>
<div id="ui" style="display:none">
<div id="namep">Perry</div>
<div id="tbox"><span id="ttext"></span><span class="arrow">▼</span></div>
</div>
<div id="choices"></div>
<div id="chapcard"></div>
<div id="panel"></div>
<div id="flash"></div>
<div id="menu">
<h1>Duct Duct<br>Sales Club!</h1>
<div class="sub">a Carolina Quality Air visual novel 💗</div>
<button onclick="startGame()">New Game</button>
<button id="contBtn" style="display:none" onclick="continueGame()">Continue</button>
<div class="tiny">You just got handed the keys to Perry's world: the walk, the talk, the number. Every choice moves TRUST (do they like you) and MARGIN (does CQA make money). Built on Pricing Doctrine v0.2.</div>
</div>
</div>

function svgURI(s){return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)}
let AC=null,snd=localStorage.getItem('ddsc_snd')!=='off';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,dur,type,g,when){const a=ac();if(!a||!snd)return;const o=a.createOscillator(),v=a.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.03;v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(when||0)+dur);o.connect(v);v.connect(a.destination);o.start(a.currentTime+(when||0));o.stop(a.currentTime+(when||0)+dur)}
function blip(){tone(920+Math.random()*160,.035,'square',.018)}
function selSnd(){tone(660,.07,'triangle',.05);tone(990,.09,'triangle',.05,.07)}
function chime(){[523,659,784].forEach((f,i)=>tone(f,.5,'sine',.05,i*.12))}
function toggleSnd(e){e.stopPropagation();snd=!snd;localStorage.setItem('ddsc_snd',snd?'on':'off');document.getElementById('sndbtn').textContent=snd?'🔊':'🔇'}

function setSprite(who,em){const s=$('sprite');if(!who){s.classList.add('hidden');return}s.src=svgURI(SPR[who+'_'+(em||'n')]||SPR[who+'_n']);s.classList.remove('hidden');s.classList.remove('hop');void s.offsetWidth;s.classList.add('hop')}
function bump(t,m,note,cls){
if(t){floater(0,t)}if(m){floater(1,m)}S.trust=Math.max(0,Math.min(100,S.trust+t));S.margin=Math.max(0,Math.min(100,S.margin+m));
document.querySelector('#trustbar i').style.width=S.trust+'%';document.querySelector('#marginbar i').style.width=S.margin+'%';
if(t<0||m<0){tone(180,.25,'sawtooth',.05)}else if(t>5||m>5){selSnd()}
if(t<0||m<0){const f=$('flash');f.style.background=t<-5||m<-5?'#c62828':'#fff';f.style.opacity=.35;setTimeout(()=>f.style.opacity=0,140)}}
let script=[],idx=0,typing=null,fullText='';
function say(n){const node=script[idx];if(!node)return endChapter();
if(node.card){showCard(node);return}
if(node.panel){node.panel();return}
$('ui').style.display='block';$('hud').style.display='flex';
if(node.bg){$('bg').className=node.bg;$('decor').innerHTML=DECOR[node.bg.replace('bg-','')]||''}
setSprite(node.sp,node.em);
$('namep').textContent=node.n||'';$('namep').style.display=node.n?'inline-block':'none';
fullText=node.t;const el=$('ttext');el.textContent='';let i=0;clearInterval(typing);
typing=setInterval(()=>{el.textContent=fullText.slice(0,++i);if(i%3===0)blip();if(i>=fullText.length)clearInterval(typing)},14);
if(node.c){setTimeout(()=>showChoices(node.c),fullText.length*14+180)}}
function showChoices(cs){const box=$('choices');box.innerHTML='';box.style.display='flex';
[...cs].sort(()=>Math.random()-.5).forEach(c=>{const b=document.createElement('button');b.textContent=c.t;b.onclick=()=>{box.style.display='none';if(c.set)S.f[c.set]=true;bump(c.tr||0,c.mg||0);
if(c.fb){script.splice(idx+1,0,{n:'Perry',sp:'perry',em:((c.tr||0)+(c.mg||0))>=0?'happy':'con',t:c.fb});}
idx++;say();save()};box.appendChild(b)})}
$('stage').addEventListener('click',e=>{
if($('choices').style.display==='flex'||$('panel').style.display==='flex'||$('chapcard').style.display==='flex'||$('menu').style.display!=='none')return;
const node=script[idx];if(!node||node.c&&$('ttext').textContent.length>=fullText.length)return;
if($('ttext').textContent.length<fullText.length){clearInterval(typing);$('ttext').textContent=fullText;if(node.c)showChoices(node.c);return}
if(node.c)return;idx++;say();save()});
function showCard(node){chime();const c=$('chapcard');c.style.display='flex';$('ui').style.display='none';setSprite(null);
c.innerHTML=`<span class="heart">💗</span><h2>${node.card}</h2><h1>${node.h}</h1><p>${node.p||''}</p><button class="go" style="max-width:220px" onclick="dismissCard()">continue</button>`;
$('bg').className=node.bg||'bg-menu';$('decor').innerHTML=DECOR[(node.bg||'').replace('bg-','')]||''}
function dismissCard(){$('chapcard').style.display='none';idx++;say();save()}
function endChapter(){S.ch++;S.i=0;if(S.ch<CHAPTERS.length){script=CHAPTERS[S.ch]();idx=0;say();save()}else{finale()}}
function save(){S.i=idx;localStorage.setItem('ddsc',JSON.stringify(S))}
function startGame(){localStorage.removeItem('ddsc');S.trust=50;S.margin=50;S.ch=0;S.f={};$('menu').style.display='none';script=CHAPTERS[0]();idx=0;bump(0,0);say()}
function continueGame(){const d=JSON.parse(localStorage.getItem('ddsc'));Object.assign(S,d);S.f=S.f||{};$('menu').style.display='none';script=CHAPTERS[S.ch]();idx=Math.min(S.i,script.length-1);bump(0,0);say()}
if(localStorage.getItem('ddsc')){const d=JSON.parse(localStorage.getItem('ddsc'));$('contBtn').textContent='Continue — Ch. '+Math.min(d.ch+1,4);$('contBtn').style.display='inline-block'}
for(let i=0;i<7;i++){const h=document.createElement('span');h.className='mheart';h.textContent=['💗','💕','🩷'][i%3];h.style.left=(5+i*14)+'%';h.style.animationDuration=(9+i*2.3)+'s';h.style.animationDelay=(-i*3.1)+'s';$('menu').appendChild(h)}

$('wgo').disabled=picked.length!==5;$('wcount').textContent='('+picked.length+'/5)'};g.appendChild(b)});

bump(tr,0);script.splice(idx+1,0,{n:'Perry',sp:'perry',em:tr>0?'happy':'con',t:fb});idx++;say();save()}}

else if(pct<=.2){notes.push(['','Close. List was $1,805 (~$1.25/sq ft). Calibrate the anchor.']);mg+=4}
else{notes.push(['bad',`$${base}? List was $1,805. ${base<1805?"You just left money on the table walking in the door.":"You'd price yourself out before the handshake."}`]);mg-=8}
if($('e2').checked&&$('e3').checked){notes.push(['good','Ozone comped LOUDLY — the $450 of goodwill only works if the customer knows it exists.']);tr+=8}
else if($('e2').checked){notes.push(['','Charging the ozone is defensible, but Perry comps it here — this job is a door into the whole church network.']);mg+=2}

$('zgo').onclick=()=>{let notes=[],tr=0,mg=0;
const want=['z1','z2','z3','z4','z5'];const hit=want.filter(id=>$(id).checked).length;
if(hit===5){notes.push(['good','Full stack: square footage base + labor + driving fee + overnight + 1.5x nights/weekends. That is the whole doctrine, word for word.']);mg+=12}
else{notes.push(['bad',`You got ${hit}/5 of the real stack. Missing lines are how out-of-town jobs go underwater.`]);mg-=6}
if($('z6').checked){notes.push(['bad','Never confirm a number you haven\u2019t built. Zach\u2019s $4k/crew/day was HIS guess — Perry let it hang and said "you tell me what it is" right back.']);mg-=8}
else{notes.push(['good','You let the $4k guess hang. The quote comes from Jeff and Perry after they see pictures, plans, and access. Capacity fact: 4\u20135 crews, ~12 people, 20k sq ft in 2 days.']);mg+=6}
if($('z7').checked){notes.push(['bad','Still trying to give away camera work. Never in an estimate.']);mg-=6}
bump(tr,mg);showFeedback('Perry leans back…',notes,()=>{idx++;say();save()})}}
function showFeedback(title,notes,done){const p=$('panel');p.style.display='flex';
p.innerHTML=`<div class="card"><h3>${title}</h3>${notes.map(n=>`<div class="fb ${n[0]}">${n[1]}</div>`).join('')}<button class="go" id="fgo">continue</button></div>`;
$('fgo').onclick=()=>{p.style.display='none';done()}}
