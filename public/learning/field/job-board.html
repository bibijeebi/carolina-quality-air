<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Board: plan the job, see the air</title>
<meta name="description" content="Turn-based duct cleaning planner. Every move previews what it reaches and where the dust goes before you commit. Graded against par.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1c2b36;--muted:#5d7282;--paper:#f3f7fa;--sheet:#fff;--line:#d3dee6;--room:#b9c9d4;--blue:#007cba;--blue-soft:#dcedf7;--rust:#b5452f;--rust-soft:#f7e1da;--gold:#e8a917;--gold-soft:#fff3cf;--green:#2e8b57;--red:#c0392b;--dirt:#6d4c2f;--loose:#b8895a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
#app{max-width:1180px;margin:0 auto;padding:10px 12px 18px;display:grid;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar h1{font-family:'Hind Madurai',Jost,sans-serif;font-size:1.25rem;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--blue)}
.stat{display:flex;align-items:baseline;gap:5px;font-size:.85rem;color:var(--muted)}
.stat b{color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.meter{width:64px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;align-self:center}
.meter i{display:block;height:100%;background:var(--green)}
.home{font-weight:700;color:var(--blue);text-decoration:none;font-size:.85rem;border:1px solid #b7cad7;border-radius:3px;padding:6px 10px;min-height:36px;display:inline-flex;align-items:center;background:#fff}
.home:hover{background:var(--blue-soft)}
.bar .stats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.bar .acts{display:flex;gap:8px;margin-left:auto}
@media (max-width:700px){.bar .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px 10px;width:100%}.bar .acts{width:100%;margin-left:0}.bar .acts .btn{flex:1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 10px;min-height:36px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:3px;padding:7px 12px;min-height:38px;font-weight:600;cursor:pointer}
.btn.alt{background:#fff;color:var(--blue);border-color:#b7cad7}
.btn:disabled{opacity:.45;cursor:default}
.board{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:10px;align-items:start}
.plan{background:var(--sheet);border:1px solid var(--line);border-radius:3px;position:relative}
.plan svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.side{display:grid;gap:10px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-width:0}
.card h2{font-size:1rem;margin:0 0 2px;font-family:'Hind Madurai',Jost,sans-serif}
.card .sub{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 4px}
.acts{display:grid;gap:6px}
.act{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid #b7cad7;background:#fff;border-radius:3px;padding:8px 10px;min-height:44px;cursor:pointer}
.act:hover:not(:disabled),.act.armed{border-color:var(--gold);background:var(--gold-soft)}
.act small{color:var(--muted);font-size:.78rem;white-space:nowrap}
.act:disabled{cursor:default;background:#f7f9fb;color:#8a9aa6}
.act .why{display:block;font-size:.78rem;color:#8a9aa6}
.act .warn{display:block;font-size:.78rem;color:var(--red);font-weight:600}
.preview{font-size:.85rem;border-left:3px solid var(--gold);padding:4px 0 4px 10px;margin-top:8px;min-height:1.4em}
.preview .bad{color:var(--red);font-weight:600}
.preview .good{color:var(--green);font-weight:600}
.picks{display:flex;flex-wrap:wrap;gap:5px}
.pick{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:.8rem;cursor:pointer;min-height:32px}
.pick.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.msg{font-size:.9rem;min-height:2.6em}
.msg b.bad{color:var(--red)}.msg b.good{color:var(--green)}
.msg span{display:block;color:var(--muted);font-size:.83rem}
.log{max-height:180px;overflow:auto;font-size:.8rem;margin:0;padding-left:20px;color:var(--muted)}
.log li{margin:2px 0}.log li.f{color:var(--red)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
#over{position:fixed;inset:0;background:#1c2b36cc;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:5}
#over .card{max-width:720px;width:100%}
.big{font-family:'Hind Madurai',Jost,sans-serif;font-size:3rem;font-weight:700;color:var(--blue);line-height:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols ol{padding-left:20px;margin:6px 0;font-size:.82rem}
.cols li{margin:2px 0}
.rep li{margin:4px 0}.rep .why{display:block;color:var(--muted);font-size:.83rem}
.duct{cursor:pointer}
.hit{stroke:transparent;fill:none;cursor:pointer}
.lbl{font-size:12px;fill:var(--muted);font-family:Jost,sans-serif;pointer-events:none}
.room{font-size:11px;letter-spacing:.12em;fill:#9fb3c3;font-weight:600;pointer-events:none}
.flowline{fill:none;stroke-width:3;stroke-dasharray:8 7;animation:dash 0.9s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.flowline{animation:none}}
@media (max-width:820px){.board{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.plan{position:sticky;top:0;z-index:2;box-shadow:0 4px 10px #1c2b3614}}
/* field kit: shared with the lab shell */
:root{color-scheme:light}
:focus-visible{outline:3px solid #c48000;outline-offset:3px}
:focus:not(:focus-visible){outline:none}
.seg button:focus-visible,.tabs button:focus-visible,.tab:focus-visible,.step:focus-visible{outline-offset:-3px}
.in-frame .bar>a.home,.in-frame .bar>h1,.in-frame .wrap>a.home,.in-frame .wrap>h1{position:absolute!important;width:1px;height:1px;margin:0;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.in-frame .scene,.in-frame .plan{position:relative!important;top:auto!important;box-shadow:none!important}
.in-frame #over{padding-top:12px}
.resume{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:#e8f3fa;border:1px solid #9bbfd5;border-left:4px solid #007cba;border-radius:3px;padding:10px 12px}
.resume-txt b{display:block}.resume-txt span{display:block;font-size:.85rem;color:#526878}
.resume-acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
<script>
/* Field training frame kit: framing, auto height, report dialog, saved runs. Same block in every field/*.html. */
(function(){
  var root=document.documentElement,framed=false;
  try{framed=window.parent!==window&&window.parent.location.origin===location.origin;}catch(e){framed=false;}
  if(framed)root.classList.add('in-frame');
  var FT=window.FT={framed:framed,banner:null};
  function post(m){if(framed){try{window.parent.postMessage(m,location.origin);}catch(e){}}}
  FT.post=post;
  var lastH=0,over=function(){return document.getElementById('over');};
  function size(){
    if(!framed)return;
    var h=Math.ceil(root.getBoundingClientRect().height),o=over();
    if(o&&o.style.display&&o.style.display!=='none'&&o.firstElementChild)h=Math.max(h,Math.ceil(o.firstElementChild.getBoundingClientRect().height)+60);
    if(h!==lastH){lastH=h;post({vel:'field-size',h:h});}
  }
  FT.size=size;
  document.addEventListener('DOMContentLoaded',function(){
    if(framed){
      // The lab shell shows the title and the way back; keep ours out of the tab order and the reading order.
      document.querySelectorAll('.bar > a.home, .wrap > a.home').forEach(function(a){a.setAttribute('tabindex','-1');a.setAttribute('aria-hidden','true');});
      if('ResizeObserver' in window){var ro=new ResizeObserver(size);ro.observe(root);var o=over();if(o&&o.firstElementChild)ro.observe(o.firstElementChild);}
      window.addEventListener('load',size);size();
    } else {
      document.querySelectorAll('a[target="_top"]').forEach(function(a){if(a.dataset.solo)a.setAttribute('href',a.dataset.solo);a.removeAttribute('target');});
    }
  });
  // ---- the report dialog ----
  var ret=null;
  function focusables(o){return Array.prototype.filter.call(o.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'),function(e){return e.getClientRects().length>0;});}
  function trap(e){
    var o=over();if(!o||o.style.display==='none')return;
    e.stopPropagation(); // tool shortcuts stay off while the report is up; default actions still run
    if(e.key==='Escape'){e.preventDefault();FT.closeOver();return;}
    if(e.key!=='Tab')return;
    var f=focusables(o);if(!f.length){e.preventDefault();return;}
    var a=f[0],z=f[f.length-1],cur=document.activeElement;
    if(!o.contains(cur)){e.preventDefault();a.focus();}
    else if(e.shiftKey&&cur===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus();}
  }
  FT.openOver=function(back,first){
    var o=over(),app=document.getElementById('app');ret=back||null;
    o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
    var h=o.querySelector('.big');if(h){h.id=h.id||'report-score';o.setAttribute('aria-labelledby',h.id);}
    o.style.display='flex';o.scrollTop=0;if(app)app.inert=true;
    document.addEventListener('keydown',trap,true);
    var f=first||focusables(o)[0];if(f)f.focus({preventScroll:true});
    if(framed){post({vel:'field-overlay'});size();}
  };
  FT.closeOver=function(){
    var o=over(),app=document.getElementById('app');
    o.style.display='none';if(app)app.inert=false;
    document.removeEventListener('keydown',trap,true);
    if(ret&&document.contains(ret)){try{ret.focus();}catch(e){}}
    size();
  };
  // ---- saved runs: one key per tool, versioned ----
  FT.run=function(tool){
    var K='vel-field-run-'+tool;
    return {
      load:function(){try{var v=JSON.parse(localStorage.getItem(K)||'null');return v&&v.v===1&&v.d&&typeof v.d==='object'&&!Array.isArray(v.d)?v:null;}catch(e){return null;}},
      save:function(d){try{localStorage.setItem(K,JSON.stringify({v:1,at:Date.now(),d:d}));}catch(e){}if(FT.banner){FT.banner.remove();FT.banner=null;size();}},
      clear:function(){try{localStorage.removeItem(K);}catch(e){}if(FT.banner){FT.banner.remove();FT.banner=null;size();}}
    };
  };
  FT.offerResume=function(o){
    var b=document.createElement('div'),when='';
    try{when=new Date(o.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){}
    b.className='resume';b.setAttribute('role','region');b.setAttribute('aria-label','Saved job');
    b.innerHTML='<div class="resume-txt"><b>You have a job in progress.</b><span></span></div><div class="resume-acts"><button type="button" class="btn">Resume your job</button><button type="button" class="btn alt">Start a new one</button></div>';
    b.querySelector('span').textContent=o.text+(when?' Saved '+when+'.':'');
    var bs=b.querySelectorAll('button');
    bs[0].onclick=function(){b.remove();FT.banner=null;try{o.resume();}catch(e){o.run.clear();}size();};
    bs[1].onclick=function(){o.run.clear();if(o.fresh)o.fresh();size();};
    var bar=document.querySelector('#app > .bar');if(bar)bar.after(b);else document.body.prepend(b);
    FT.banner=b;
  };
  // Scores for the hub: vel-field is {tool:{n,best,last,at}}; anything else is replaced.
  FT.record=function(tool,score){
    try{var K='vel-field',m={};try{var v=JSON.parse(localStorage.getItem(K)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))m=v;}catch(e){}
      var r=m[tool]&&typeof m[tool]==='object'?m[tool]:{};var n=Number.isFinite(r.n)?r.n:0,best=Number.isFinite(r.best)?r.best:0;
      m[tool]={n:n+1,best:Math.max(best,score),last:score,at:Date.now()};localStorage.setItem(K,JSON.stringify(m));}catch(e){}
    post({vel:'field',tool:tool});
  };
})();
</script>
</head>
<body>
<div id="app">
  <div class="bar">
    <a class="home" href="../#/field" target="_top">&larr; Field training</a>
    <h1>Job Board</h1>
    <div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="learn" class="on">Learn</button><button type="button" data-mode="test">Test</button></div>
    <div class="stats">
    <span class="stat">Clock <b id="clock">0:00</b></span>
    <span class="stat">Return <span class="meter"><i id="m-ret"></i></span></span>
    <span class="stat">Supply <span class="meter"><i id="m-sup"></i></span></span>
    <span class="stat">Flags <b id="flags">0</b></span>
    </div>
    <div class="acts">
    <button type="button" class="btn alt" id="undo">Undo</button>
    <button type="button" class="btn" id="finish">Finish job</button>
    </div>
  </div>
  <div class="board">
    <div class="plan"><svg id="svg" viewBox="0 0 800 600" role="img" aria-label="Plan view of a house with the attic duct system drawn over it"></svg></div>
    <div class="side">
      <div class="card"><div class="msg" id="msg" role="status" aria-live="polite"></div></div>
      <div class="card"><p class="eyebrow" id="sel-kind">Pick a spot</p><h2 id="sel-name">Tap the plan or a chip</h2><p class="sub" id="sel-sub"></p><div class="acts" id="acts"></div><div class="preview" id="prev"></div></div>
      <div class="card"><p class="eyebrow">Everything on the job</p><div class="picks" id="picks"></div></div>
      <div class="card"><details><summary>Job log</summary><ol class="log" id="log"></ol></details></div>
    </div>
  </div>
</div>
<div id="over"><div class="card" id="report"></div></div>
<script>
'use strict';
// ---------- the job ----------
const Q=(x0,y0,cx,cy,x1,y1)=>{const o=[];for(let i=0;i<=12;i++){const t=i/12,a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;o.push([a*x0+b*cx+c*x1,a*y0+b*cy+c*y1]);}return o;};
const SEG={
  RP:{side:'return',kind:'plenum',mat:'metal',label:'Return plenum',up:null,rect:[293,273,52,54]},
  R1:{side:'return',kind:'trunk',label:'Near return trunk',up:'RP',pts:[[293,300],[190,300]]},
  R2:{side:'return',kind:'trunk',label:'Far return trunk',up:'R1',pts:[[190,300],[64,300]]},
  bR:{side:'return',kind:'flex',label:'Dining return flex',up:'R1',pts:Q(240,300,232,430,150,470),reg:'DR'},
  SP:{side:'supply',kind:'plenum',mat:'board',label:'Supply plenum',up:null,rect:[405,273,52,54]},
  T1:{side:'supply',kind:'trunk',label:'Near supply trunk',up:'SP',pts:[[457,300],[560,300]]},
  T2:{side:'supply',kind:'trunk',label:'Mid supply trunk',up:'T1',pts:[[560,300],[690,300]]},
  T3:{side:'supply',kind:'trunk',label:'Supply trunk past the elbow',up:'T2',pts:[[690,300],[690,410]]},
  T4:{side:'supply',kind:'trunk',label:'Supply trunk end cap',up:'T3',pts:[[690,410],[690,522]]},
  bK:{side:'supply',kind:'flex',label:'Kitchen flex',up:'SP',pts:Q(431,273,424,112,172,112),reg:'K'},
  bL:{side:'supply',kind:'flex',label:'Living flex',up:'T1',pts:Q(512,300,500,430,544,452),reg:'L'},
  bB2:{side:'supply',kind:'flex',label:'Bedroom 2 flex',up:'T2',pts:Q(632,300,642,200,632,112),reg:'B2'},
  bBa:{side:'supply',kind:'flex',label:'Bath flex',up:'T3',pts:Q(690,356,722,340,748,302),reg:'BA'},
  bM:{side:'supply',kind:'flex',label:'Master flex',up:'T4',pts:Q(690,522,706,548,744,500),reg:'M'}
};
for(const k in SEG){const s=SEG[k];if(s.rect){const[x,y,w,h]=s.rect;s.pts=[[x+w/2,y+h/2]];}}
const REG={
  K:{seg:'bK',name:'Kitchen supply',soil:'greasy',at:[172,112]},
  B2:{seg:'bB2',name:'Bedroom 2 supply',soil:'caked',at:[632,112]},
  L:{seg:'bL',name:'Living supply',soil:'light',at:[544,452]},
  BA:{seg:'bBa',name:'Bath supply',soil:'light',at:[748,302]},
  M:{seg:'bM',name:'Master supply',soil:'caked',at:[744,500]},
  DR:{seg:'bR',name:'Dining return',soil:'light',at:[150,470]},
  RG:{seg:'R2',name:'Main return grille',soil:'caked',at:[50,300]}
};
const SOIL={light:{txt:'light dust',rag:1,hose:1,pw:1},caked:{txt:'caked dust packed in the fins',rag:.5,hose:1,pw:1},greasy:{txt:'greasy film from kitchen air',rag:.2,hose:.4,pw:1}};
// Rod reach from each way in. Hard rod: straight metal runs only, about four sections. Soda rod: coils through flex and around 90s.
const REACH={
  RP:{hard:['RP','R1','R2'],soda:['RP','R1']}, SP:{hard:['SP','T1','T2'],soda:['SP','T1']},
  K:{soda:['bK']}, L:{soda:['bL','T1']}, B2:{soda:['bB2','T2']}, BA:{soda:['bBa','T3']}, M:{soda:['bM','T4','T3']},
  DR:{soda:['bR','R1']}, RG:{hard:['R2','R1'],soda:['R2','R1']},
  'h:R1':{hard:['R1','R2'],soda:['R1','R2']}, 'h:R2':{hard:['R2','R1'],soda:['R2','R1']},
  'h:T1':{hard:['T1','T2'],soda:['T1','T2']}, 'h:T2':{hard:['T2','T1'],soda:['T2','T3']},
  'h:T3':{hard:['T3','T4'],soda:['T3','T4']}, 'h:T4':{hard:['T4','T3'],soda:['T4','T3']}
};
const MIN_HOLES=2;
const COST={walk:8,power_off:2,power_on:1,ah:20,cut8:6,hook:3,unhook:2,tie:1,mach:1,bit:2,plug:2,patch_metal:8,patch_fsk:4,pull:1,wash_rag:3,wash_hose:5,wash_pw:7,reinstall:1,whip:3,fwd:2};
const MACH=[372,548];

// ---------- engine (pure over state, so previews are just a run on a copy) ----------
function rng(seed){let s=seed%2147483647||1;return()=>(s=s*16807%2147483647)/2147483647;}
function fresh(seed){
  const r=rng(seed||7),S={seg:{},reg:{},holes:{},hose:null,tied:false,mach:false,power:true,walked:false,ah:false,min:0,vio:[],def:[],log:[],fx:[],house:0};
  for(const k in SEG)S.seg[k]={g:72+Math.floor(r()*22),l:0};
  for(const k in REG)S.reg[k]={on:true,dirt:65+Math.floor(r()*25)};
  return S;
}
const copy=S=>JSON.parse(JSON.stringify(S));
const clean=(S,k)=>S.seg[k].g<8&&S.seg[k].l<8;
const sideSegs=s=>Object.keys(SEG).filter(k=>SEG[k].side===s);
const sideClean=(S,s)=>sideSegs(s).every(k=>clean(S,k));
const negOn=(S,side)=>S.mach&&S.hose&&SEG[S.hose].side===side;
const upChain=k=>{const o=[];let c=SEG[k].up;while(c){o.push(c);c=SEG[c].up;}return o;};
function flag(S,code,text,why){if(S.vio.some(v=>v.code===code))return;S.vio.push({code,text,why});S.log.push({t:text,f:1});}
function entryOpen(S,e){
  if(REG[e])return !S.reg[e].on;
  if(e.startsWith('h:')){const h=S.holes[e.slice(2)];return !!(h&&h.type==='1'&&!h.closed);}
  const h=S.holes[e];return !!(h&&h.type==='8'&&!h.closed);
}
const entryName=e=>REG[e]?REG[e].name+' boot':e.startsWith('h:')?'bit hole in the '+SEG[e.slice(2)].label.toLowerCase():SEG[e].label.toLowerCase()+' access';
const entrySide=e=>SEG[(REACH[e].hard||REACH[e].soda)[0]].side;
function reachSet(e,rod){const R=REACH[e];return rod==='nozzle'?(R.hard||R.soda):R[rod]||null;}
function reachableWithoutDrilling(k){const o=[];for(const e in REACH){if(e.startsWith('h:'))continue;for(const rod of['soda','hard']){const s=REACH[e][rod];if(s&&s.includes(k)){o.push((rod==='hard'?'hard rod':'soda rod')+' from the '+entryName(e));break;}}}return o;}
const names=ks=>ks.map(k=>SEG[k].label.toLowerCase()).join(', ');

function act(S,a){
  S.fx=[];const say=(t,s,cls)=>{S.say={t,s,cls};};const cost=m=>{S.min+=m;};
  const logit=t=>S.log.push({t,m:S.min});
  switch(a.k){
  case 'walk': S.walked=true;cost(COST.walk);say('Walked it.','Air handler in the middle, return plenum west, supply plenum east. The supply trunk turns 90 at the far end, so the hard rod stops there.','good');logit('Walked the job');break;
  case 'power_off': S.power=false;cost(COST.power_off);say('Power killed and locked out.','The blower cannot fight the negative air now.','good');logit('Killed power');break;

// What you can do at each spot. Things that cannot happen are listed with the reason; bad practice is allowed and graded.
function actions(S,t){
  const o=[],A=(a,label,min,off)=>o.push({a,label,min,off:off||null});
  if(t==='ah'){
    if(!S.walked)A({k:'walk'},'Walk the job: air handler, both plenums, every grille',COST.walk);
    A(S.power?{k:'power_off'}:{k:'power_on'},S.power?'Kill power at the disconnect and lock it out':'Restore power',S.power?COST.power_off:COST.power_on);
    A({k:'ah'},'Panel off, spray the coil, wipe the blower, panel on',COST.ah,S.ah?'Already done.':S.power?'Kill power first.':null);
    return o;}
  if(t==='mach'){
    A({k:'mach'},S.mach?'Turn the machine off':'Turn the machine on',COST.mach);
    A({k:'tie'},'Tie the hose off',COST.tie,!S.hose?'No hose hooked up.':S.tied?'Already tied.':null);
    if(S.hose)A({k:'unhook'},'Pull the hose off the '+SEG[S.hose].label.toLowerCase(),COST.unhook);
    return o;}
  if(REG[t]){const r=S.reg[t];
    if(r.on){A({k:'pull',t},'Pull the grille',COST.pull);return o;}
    A({k:'whip',e:t,rod:'soda'},'Whip with the soda rod through the boot',COST.whip*REACH[t].soda.length);
    if(REACH[t].hard)A({k:'whip',e:t,rod:'hard'},'Whip with the hard rod',COST.whip*REACH[t].hard.length);
    else A({k:'x'},'Whip with the hard rod',0,'The hard rod will not make it through flex.');
    A({k:'fwd',e:t},'Forward with the air nozzle',COST.fwd*reachSet(t,'nozzle').length);
    A({k:'wash',t,m:'rag'},'Wash: rag',COST.wash_rag);A({k:'wash',t,m:'hose'},'Wash: garden hose',COST.wash_hose);A({k:'wash',t,m:'pw'},'Wash: pressure washer and degreaser',COST.wash_pw);
    A({k:'reinstall',t},'Reinstall the grille',COST.reinstall);
    return o;}
  const s=SEG[t];if(!s)return o;
  if(s.kind==='flex'){A({k:'x'},'Cut a hole in the flex',0,'Do not cut flex. Branches get cleaned from the register boot.');return o;}
  const h=S.holes[t];
  if(s.kind==='plenum'){
    if(!h)A({k:'cut8',t},'Cut an 8 inch access',COST.cut8);
    else if(!h.closed){
      A({k:'hook',t},'Hook the negative air hose here',COST.hook,S.hose===t?'Hose is already here.':null);
      A({k:'whip',e:t,rod:'hard'},'Whip with the hard rod through the access',COST.whip*REACH[t].hard.length);
      A({k:'whip',e:t,rod:'soda'},'Whip with the soda rod through the access',COST.whip*REACH[t].soda.length);
      A({k:'fwd',e:t},'Forward with the air nozzle',COST.fwd*reachSet(t,'nozzle').length);
      const hoseHere=S.hose===t?'Pull the hose off first.':null;
      A({k:'patch',t,m:'metal'},'Patch: metal, mastic, and screws',COST.patch_metal,hoseHere);
      A({k:'patch',t,m:'fsk'},'Patch: FSK tape',COST.patch_fsk,hoseHere);
    } else A({k:'x'},'Access',0,'Patched.');
    A({k:'x'},'Drill a 1 inch bit hole',0,'A bit hole will not take the hose. Plenums get the 8 inch access.');
    return o;}
  if(!h)A({k:'bit',t},'Drill a 1 inch bit hole',COST.bit);
  else if(!h.closed){const e='h:'+t;
    A({k:'whip',e,rod:'hard'},'Whip with the hard rod through the bit hole',COST.whip*REACH[e].hard.length);
    A({k:'whip',e,rod:'soda'},'Whip with the soda rod through the bit hole',COST.whip*REACH[e].soda.length);
    A({k:'fwd',e},'Forward with the air nozzle',COST.fwd*reachSet(e,'nozzle').length);
    A({k:'plug',t},'Pop plug and FSK tape',COST.plug);}
  else A({k:'x'},'Bit hole',0,'Plugged.');
  A({k:'x'},'Cut an 8 inch access',0,'The hose hooks up at a plenum. Trunks take a bit hole when nothing else reaches.');
  return o;
}
function valid(S,a){if(a.k==='x')return false;const t=a.t||a.e||(a.k==='walk'||a.k==='power_off'||a.k==='power_on'||a.k==='ah'?'ah':'mach');
  const tgt=a.e?(REG[a.e]?a.e:a.e.startsWith('h:')?a.e.slice(2):a.e):t;
  if(a.e&&!entryOpen(S,a.e))return false;
  return actions(S,tgt).some(x=>!x.off&&JSON.stringify(x.a)===JSON.stringify(a));}

function grade(S){
  const segs=Object.keys(SEG),cleanPct=Math.round(segs.reduce((a,k)=>a+(clean(S,k)?100:Math.max(0,100-Math.min(100,S.seg[k].g+S.seg[k].l))),0)/segs.length);
  const holes=Object.entries(S.holes),open=holes.filter(([,h])=>!h.closed),off=Object.keys(S.reg).filter(r=>!S.reg[r].on),dirty=Object.keys(S.reg).filter(r=>S.reg[r].dirt>=8);
  const extra=Math.max(0,holes.length-MIN_HOLES);
  let s=cleanPct-S.vio.length*8-open.length*10-off.length*5-dirty.length*5-extra*4-(S.ah?0:12)-S.def.length*3-(S.hose?3:0)-(S.mach?2:0)-(S.power?0:5);
  return {score:Math.max(0,Math.round(s)),cleanPct,open,off,dirty,holes:holes.length,extra};
}

    el('rect',{x:x-12,y:y-12,width:24,height:24,fill:st.on?'#fff':'#1c2b36',stroke:SEG[R.seg].side==='supply'?'#007cba':'#b5452f','stroke-width':2.5},rg);
    if(st.on)for(let i=-6;i<=6;i+=4)el('line',{x1:x-8,x2:x+8,y1:y+i,y2:y+i,stroke:'#6d4c2f','stroke-width':1.6,opacity:(Math.min(1,st.dirt/80)*.8+.2).toFixed(2)},rg);
    el('rect',{x:x-22,y:y-22,width:44,height:44,class:'hit',fill:'transparent'},rg);}
  // machine and hose
  if(S.hose){const p=SEG[S.hose].pts[0];el('path',{d:`M${MACH[0]} ${MACH[1]-14} C ${MACH[0]} ${MACH[1]-120}, ${p[0]} ${p[1]+90}, ${p[0]} ${p[1]+20}`,fill:'none',stroke:'#1c2b36','stroke-width':6,'stroke-linecap':'round',opacity:.8},g);
    if(S.tied)el('circle',{cx:(MACH[0]+p[0])/2,cy:(MACH[1]+p[1])/2+10,r:5,fill:'#e8a917'},g);}
  const mg=el('g',{class:'duct','data-t':'mach'},g);
  if(sel==='mach')el('rect',{x:MACH[0]-34,y:MACH[1]-22,width:68,height:44,rx:5,fill:'none',stroke:'#e8a917','stroke-width':3},mg);
  el('rect',{x:MACH[0]-28,y:MACH[1]-16,width:56,height:32,rx:4,fill:S.mach?'#f4c33a':'#e6eef3',stroke:'#1c2b36','stroke-width':2},mg);
  el('text',{x:MACH[0],y:MACH[1]+5,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#1c2b36'},mg).textContent=S.mach?'NEG ON':'NEG OFF';
  el('rect',{x:MACH[0]-40,y:MACH[1]-28,width:80,height:56,class:'hit',fill:'transparent'},mg);
  // preview flow lines
  if(prev&&prev.flows)for(const f of prev.flows)el('path',{d:pathStr(f.p),class:'flowline',stroke:f.ok?'#2e8b57':'#c0392b'},g);
  if(S.house>1){el('text',{x:30,y:572,'font-size':12,fill:'#c0392b','font-weight':700}).textContent='Dust in the house: '+Math.round(S.house);}
}
function plan(prev){drawBase();drawDucts(prev);drawAnim();}
function render(){plan();hud();}
function hud(){
  $('clock').textContent=fmt(S.min);$('flags').textContent=S.vio.length;
  const pct=s=>{const ks=sideSegs(s);return 100-ks.reduce((a,k)=>a+Math.min(100,S.seg[k].g+S.seg[k].l),0)/ks.length;};
  $('m-ret').style.width=pct('return')+'%';$('m-sup').style.width=pct('supply')+'%';
  $('undo').disabled=mode==='test'||!hist.length;
  const m=S.say;$('msg').innerHTML=m?`<b class="${m.cls||''}">${esc(m.t)}</b><span>${esc(m.s||'')}</span>`:'<b>Walk the job, then plan it.</b><span>Tap anything on the plan. Every move shows what it reaches and where the dust goes before you commit.</span>';
  $('log').innerHTML=S.log.map(l=>`<li class="${l.f?'f':''}">${l.f?'Flag: ':''}${esc(l.t)}</li>`).join('');
  picks();panelFor();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function targets(){return ['ah','mach','RP','SP',...Object.keys(REG),'R1','R2','T1','T2','T3','T4'];}
function tname(t){return t==='ah'?'Air handler':t==='mach'?'Negative air machine':REG[t]?(/grille$/.test(REG[t].name)?REG[t].name:REG[t].name+' grille'):SEG[t].label;}
function picks(){$('picks').innerHTML=targets().map(t=>`<button type="button" class="pick${sel===t?' on':''}" data-t="${t}">${esc(tname(t))}</button>`).join('');}
function describe(t){
  if(t==='ah')return['Equipment','Air handler',`Power ${S.power?'on':'off'}. ${S.ah?'Coil and blower done.':'Coil and blower not cleaned.'} Sits between both sides.`];
  if(t==='mach')return['Equipment','Negative air machine',(S.mach?'Running. ':'Off. ')+(S.hose?'Hose on the '+SEG[S.hose].label.toLowerCase()+(S.tied?', tied off.':', not tied.'):'No hose hooked up.')];
  if(REG[t]){const r=S.reg[t];return[SEG[REG[t].seg].side==='supply'?'Supply register':'Return grille',REG[t].name,(r.on?'Installed. ':'Off, boot open. ')+SOIL[REG[t].soil].txt+', '+Math.round(r.dirt)+'% dirty. Serves the '+SEG[REG[t].seg].label.toLowerCase()+'.'];}
  const s=SEG[t],st=S.seg[t],h=S.holes[t];
  return[(s.side==='supply'?'Supply ':'Return ')+(s.kind==='plenum'?'plenum':s.kind==='flex'?'flex branch':'trunk'),s.label,`${Math.round(st.g)}% caked, ${Math.round(st.l)}% loose.${s.mat==='board'?' Duct board.':s.kind!=='flex'?' Sheet metal.':''}${h?(h.type==='8'?' 8 in. access':' Bit hole')+(h.closed?' closed.':' open.'):''}`];
}
function panelFor(){
  if(!sel){$('sel-kind').textContent='Pick a spot';$('sel-name').textContent='Tap the plan or a chip';$('sel-sub').textContent='';$('acts').innerHTML='';$('prev').innerHTML='';return;}
  const[k,n,sub]=describe(sel);$('sel-kind').textContent=k;$('sel-name').textContent=n;$('sel-sub').textContent=sub;
  const list=actions(S,sel);
  $('acts').innerHTML=list.map((x,i)=>{const w=!x.off&&mode==='learn'?warnings(x.a):[];
    return `<button type="button" class="act${armed===i?' armed':''}" data-i="${i}"${x.off?' disabled':''}><span>${esc(x.label)}${x.off?`<span class="why">${esc(x.off)}</span>`:''}${w.length?`<span class="warn">Lead flags: ${esc(w[0])}</span>`:''}</span>${x.off?'':`<small>+${x.min} min</small>`}</button>`;}).join('');
  $('acts').querySelectorAll('.act').forEach(b=>{const x=list[+b.dataset.i];
    b.onmouseenter=()=>{if(!x.off)preview(x.a);};b.onfocus=()=>{if(!x.off)preview(x.a);};b.onmouseleave=()=>{if(armed==null){plan();$('prev').innerHTML='';}};
    b.onclick=()=>{if(x.off)return;const i=+b.dataset.i;if(coarse&&armed!==i){armed=i;preview(x.a);$('acts').querySelectorAll('.act').forEach((y,j)=>y.classList.toggle('armed',j===i));return;}commit(x.a);};});
}
function warnings(a){const T=copy(S);act(T,a);return T.vio.slice(S.vio.length).map(v=>v.text).concat(T.def.slice(S.def.length));}
function preview(a){
  const T=copy(S);act(T,a);const p={set:[],red:[],flows:[]};
  if(a.k==='whip'||a.k==='fwd')p.set=a.k==='fwd'?reachSet(a.e,'nozzle'):reachSet(a.e,a.rod);
  if(REG[a.e])p.reg=a.e;
  if(a.k==='fwd'){p.red=T.dirtied||[];const ok=negOn(S,entrySide(a.e));for(const k of p.set)if(S.seg[k].l>=1)p.flows.push({p:ok?flowPath(k):outPath(k),ok});}
  plan(p);
  const w=T.vio.slice(S.vio.length),d=T.def.slice(S.def.length),bits=[`+${T.min-S.min} min`];
  if(p.set.length)bits.push((a.k==='fwd'?'Pushes: ':'Reaches: ')+names(p.set));
  if(a.k==='fwd'&&!p.flows.length)bits.push('nothing loose to push');
  let html=esc(bits.join(' · '));
  if(mode==='learn'){if(w.length||d.length)html+='<br>'+[...w.map(v=>v.text),...d].map(t=>`<span class="bad">Lead flags: ${esc(t)}</span>`).join('<br>');else if(a.k==='whip'||a.k==='fwd')html+=' · <span class="good">no flags</span>';}
  if(coarse&&armed!=null)html+='<br><b>Tap it again to do it.</b>';
  $('prev').innerHTML=html;
}
function commit(a){
  if(!valid(S,a))return;
  hist.push(copy(S));if(hist.length>80)hist.shift();
  const before=copy(S);act(S,a);armed=null;persist();
  if(a.k==='fwd'){const ok=negOn(before,entrySide(a.e));for(const f of S.fx)startAnim(ok?flowPathFrom(before,f.k):outPath(f.k),ok);}
  render();$('prev').innerHTML='';
}
function flowPathFrom(B,k){const keep=S;S=B;const p=flowPath(k);S=keep;return p;}
function startAnim(path,ok){const len=[];let L=0;for(let i=1;i<path.length;i++){L+=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);len.push(L);}
  const dots=[];for(let i=0;i<22;i++)dots.push({o:i/22*0.5+Math.random()*.08});anim.push({path,len,L,dots,t0:performance.now(),ok});if(anim.length===1)requestAnimationFrame(tick);}
function at(A,d){d=Math.max(0,Math.min(A.L,d));let i=0;while(i<A.len.length-1&&A.len[i]<d)i++;const s0=i?A.len[i-1]:0,f=(d-s0)/((A.len[i]-s0)||1),p=A.path[i],q=A.path[i+1];return[p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f];}
function drawAnim(){const old=document.getElementById('anim');if(old)old.remove();if(!anim.length)return;const g=el('g',{id:'anim','pointer-events':'none'});const now=performance.now();
  for(const A of anim){const t=(now-A.t0)/1400;for(const d of A.dots){const u=t-d.o;if(u<0||u>1)continue;const[x,y]=at(A,u*A.L);el('circle',{cx:x,cy:y,r:3.2,fill:A.ok?'#8a6038':'#c0392b',opacity:(1-u*.5).toFixed(2)},g);}}}
function tick(){const now=performance.now();anim=anim.filter(A=>now-A.t0<2200);drawAnim();if(anim.length)requestAnimationFrame(tick);}
svg.addEventListener('click',e=>{const g=e.target.closest('[data-t]');sel=g?g.dataset.t:null;armed=null;render();});
$('picks').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;sel=b.dataset.t;armed=null;render();});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode===mode)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));restart(mode==='test'?'Test mode: no previews of flags, no undo. The lead grades it at the end.':'Learn mode: every move shows what the lead would flag.');});
$('undo').onclick=()=>{if(mode==='test'||!hist.length)return;S=hist.pop();armed=null;render();persist();};
function restart(note){RUN.clear();S=fresh(Date.now()%100000);hist=[];sel=null;armed=null;S.say={t:'New job.',s:note||''};render();}
$('finish').onclick=finish;
function finish(){
  const G=grade(S),li=(t,w)=>`<li>${esc(t)}${w?`<span class="why">${esc(w)}</span>`:''}</li>`;
  FT.record('job-board',G.score);RUN.clear();
  const mine=S.log.map(l=>`<li${l.f?' style="color:#c0392b"':''}>${l.f?'Flag: ':''}${esc(l.t)}</li>`).join('');
  $('report').innerHTML=`<p class="eyebrow">${mode==='test'?'Test':'Learn'} mode · the lead's grade</p><div class="big">${G.score}<span style="font-size:1.2rem;color:#5d7282"> / 100</span></div>
  <p class="sub">${fmt(S.min)} on the clock. Par is ${fmt(par.min)} for a 100.</p>
  <ul class="rep">${li(`Ducts ${G.cleanPct}% clean.`,G.cleanPct<95?'Anything still loose counts as dirty. Whip, then forward.':'')}
  ${li(`${G.holes} holes cut, ${MIN_HOLES} was the minimum.`,'Two plenum accesses for the hose. Everything else reaches with the soda rod from an open boot, or the hard rod through the plenum access. Bit holes are for when neither reaches.')}
  ${G.open.length?li(`${G.open.length} hole${G.open.length>1?'s':''} left open.`,'Walk it and count against the holes you cut.'):li('Every hole closed.')}
  ${G.off.length?li(`${G.off.length} grille${G.off.length>1?'s':''} still off.`):''}
  ${G.dirty.length?li(`${G.dirty.length} grille${G.dirty.length>1?'s':''} not clean: ${G.dirty.map(r=>REG[r].name).join(', ')}.`,'Rag for dust, garden hose for packed fins, pressure washer and degreaser for grease.'):li('Every grille washed.')}
  ${S.ah?li('Air handler done.'):li('Air handler not cleaned.','Kill power, panel off, spray the coil, wipe the blower, panel on.')}
  ${S.hose?li('Hose still hooked up.'):''}${S.mach?li('Machine still running.'):''}${S.power?'':li('System left off.','Restore power and check it runs before you leave.')}
  ${S.house>1?li('Dust pushed into the house.','That happens when you forward with nothing pulling on that side.'):''}
  ${S.vio.map(v=>li(v.text,v.why)).join('')}${S.def.map(d=>li(d)).join('')}</ul>
  <div class="cols"><div><p class="eyebrow">What you did</p><ol>${mine||'<li>Nothing yet.</li>'}</ol></div><div><p class="eyebrow">The lead's order (${fmt(par.min)})</p><ol>${par.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn" id="again">Run a new job</button><button type="button" class="btn alt" id="back">Back to this job</button></div>`;
  $('over').style.display='flex';$('again').onclick=()=>{FT.closeOver();restart();};$('back').onclick=()=>{FT.closeOver();persist();};FT.openOver($('finish'),$('again'));
}
window.__JB={get S(){return S},act,valid,grade,PAR,par,commit,actions,fresh};
render();
// ---------- keep the job if you leave ----------
function persist(){if(S.log.length)RUN.save({S,mode});}
(function(){const sv=RUN.load(),d=sv&&sv.d;if(!d||!d.S||!Array.isArray(d.S.log)||!d.S.log.length||!d.S.seg)return;
  FT.offerResume({run:RUN,at:sv.at,text:`${d.S.log.length} move${d.S.log.length===1?'':'s'}, ${fmt(d.S.min||0)} on the clock, ${d.mode==='test'?'Test':'Learn'} mode.`,
    resume(){mode=d.mode==='test'?'test':'learn';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));S=d.S;hist=[];sel=null;armed=null;S.say={t:'Back on the job.',s:'Undo history starts fresh from here.'};render();}});})();
</script>
</body>
