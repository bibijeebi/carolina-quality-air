<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1c2024;--mut:#6a7480;--acc:#0d6d8e;--red:#c62828;--amb:#b26a00;--ok:#2e7d32;--line:#dfe3e8;--paper:#fbfaf7;--sa:#0d6d8e;--ra:#b26a00;--ea:#c62828;--oa:#2e7d32}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 80px}
.back{color:var(--acc);font-size:13.5px;text-decoration:none;font-weight:700}
h1{font-size:24px;letter-spacing:-.5px;margin:6px 0 0}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:#fff;color:var(--mut);border:1.5px solid var(--line);border-radius:9px;padding:9px 4px;font-weight:700;font-size:13.5px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
button{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
button.small{padding:7px 12px;font-size:13.5px}
button:disabled{opacity:.45;cursor:default}
.mut{color:var(--mut)}.small{font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scene{background:var(--paper);border:1px solid #cfd4d9;border-radius:8px;margin:8px 0;overflow:hidden;display:flex;justify-content:center}
.scene svg{display:block;width:100%;max-width:440px;height:auto}
svg text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;fill:#1c2024}
svg .ink{fill:none;stroke:#1c2024;stroke-width:1.1}
svg .thin{fill:none;stroke:#1c2024;stroke-width:.6}
svg .hair{fill:none;stroke:#8a939c;stroke-width:.5;stroke-dasharray:2 2}
svg .wall{fill:none;stroke:#1c2024;stroke-width:2.2}
svg .fill{fill:#1c2024}
svg .hi{stroke:#ffb300;stroke-width:5;fill:none;opacity:.55;stroke-linecap:round}
svg .wood{fill:#e8d9bf;stroke:#b8a37f;stroke-width:.6}
svg .metal{fill:#eef1f3;stroke:#1c2024;stroke-width:1}
svg .ins{fill:#fbf3d6;stroke:#1c2024;stroke-width:.9}
svg .face{fill:#fff;stroke:#1c2024;stroke-width:1}
svg .sky{fill:#eaf2f7}
svg .tap{cursor:pointer}
svg .sel{fill:#ffe082}
.timer{height:6px;background:#e6e9ec;border-radius:3px;overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:var(--acc);width:100%;transform-origin:left;transition:none}
.timer i.run{transition:transform linear}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ans button{padding:14px 8px;font-size:16px}
.ans.one{grid-template-columns:1fr}
.ans button.sa{background:var(--sa)}.ans button.ra{background:var(--ra)}.ans button.ea{background:var(--ea)}.ans button.oa{background:var(--oa)}
.ans button.opt{background:#fff;color:var(--ink);border:1.5px solid var(--line);text-align:left;font-weight:600;font-size:14.5px;line-height:1.35}
.ans button.right{background:#e3f2e6;border-color:var(--ok);color:var(--ok)}
.ans button.wrong{background:#fbeaea;border-color:var(--red);color:var(--red)}
.q{font-weight:700;font-size:16px;margin:6px 0 2px}
.fb{border-radius:9px;padding:10px 12px;margin-top:10px;font-size:14.5px;line-height:1.5}
.fb.ok{background:#e3f2e6;border:1px solid #bfe0c5}
.fb.bad{background:#fbeaea;border:1px solid #efc4c4}
.fb b.h{display:block;margin-bottom:3px}
.stat{display:flex;gap:14px;font-size:13.5px;color:var(--mut);margin-bottom:4px}
.stat b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;line-height:1.3;background:#fff}
.cell.m0{background:#fff}.cell.m1{background:#fbeaea;border-color:#efc4c4}.cell.m2{background:#fff5e0;border-color:#f0d7a3}.cell.m3{background:#e3f2e6;border-color:#bfe0c5}
.cell small{display:block;color:var(--mut)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:6px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.score{font-size:32px;font-weight:800;letter-spacing:-1px}
kbd{background:#eef1f4;border-radius:4px;padding:0 5px;font-size:12.5px}
details summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:14px;margin-top:8px}
footer{margin-top:34px;color:#9aa4ae;font-size:12.5px}
</style>

<div class="wrap">

<h1>Duct Reflex</h1>
<p class="sub">Look, call it, next. Supply or return, which way it flows, what's upstream, what the move is. Rep each cue until it's boring.</p>
<nav class="tabs"><button data-tab="flash" class="on">Flash</button><button data-tab="trace">Trace</button><button data-tab="call">Call</button><button data-tab="board">Board</button></nav>
<main id="app"></main>
<footer>Carolina Quality Air, Inc. · training tool · scenes are generated, not real projects</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LS='dreflex_v1';
let ST=JSON.parse(localStorage.getItem(LS)||'null')||{h:{},reps:0,streak:0,best:0};
const save=()=>localStorage.setItem(LS,JSON.stringify(ST));
const STREAM={SA:'Supply',RA:'Return',EA:'Exhaust',OA:'Outside air'};

// ---------- drawing helpers ----------
const arrow=(x,y,dir,s=5)=>{const d={r:[[x-s,y-s],[x+s,y],[x-s,y+s]],l:[[x+s,y-s],[x-s,y],[x+s,y+s]],u:[[x-s,y+s],[x,y-s],[x+s,y+s]],d:[[x-s,y-s],[x,y+s],[x+s,y-s]]}[dir];return `<polygon points="${d.map(p=>p.join(',')).join(' ')}" class="fill"/>`};
const duct=(x1,y1,x2,y2,w,lbl,dir)=>{
  const h=x1!==x2;const o=w/2;let s='';
  if(h){s+=`<line x1="${x1}" y1="${y1-o}" x2="${x2}" y2="${y2-o}" class="ink"/><line x1="${x1}" y1="${y1+o}" x2="${x2}" y2="${y2+o}" class="ink"/>`;if(lbl)s+=`<text x="${(x1+x2)/2}" y="${y1-o-3}" text-anchor="middle">${lbl}</text>`;if(dir)s+=arrow((x1+x2)/2,y1,dir,4)}
  else{s+=`<line x1="${x1-o}" y1="${y1}" x2="${x2-o}" y2="${y2}" class="ink"/><line x1="${x1+o}" y1="${y1}" x2="${x2+o}" y2="${y2}" class="ink"/>`;if(lbl)s+=`<text x="${x1+o+3}" y="${(y1+y2)/2+3}">${lbl}</text>`;if(dir)s+=arrow(x1,(y1+y2)/2,dir,4)}
  return s};
const flex=(x1,y1,x2,y2)=>{const n=Math.max(4,Math.floor(Math.hypot(x2-x1,y2-y1)/5));let s=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ink" stroke-width="7" stroke="#fff"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ink" stroke-width="7" fill="none" stroke="#1c2024" stroke-opacity=".12"/>`;
  const dx=(x2-x1)/n,dy=(y2-y1)/n,px=-dy/Math.hypot(dx,dy)*3.5,py=dx/Math.hypot(dx,dy)*3.5;
  for(let i=0;i<=n;i++){const x=x1+dx*i,y=y1+dy*i;s+=`<line x1="${x-px}" y1="${y-py}" x2="${x+px}" y2="${y+py}" class="thin"/>`}
  s+=`<line x1="${x1-px}" y1="${y1-py}" x2="${x2-px}" y2="${y2-py}" class="thin"/><line x1="${x1+px}" y1="${y1+py}" x2="${x2+px}" y2="${y2+py}" class="thin"/>`;return s};
const diff=(x,y,s=14)=>`<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" class="ink"/><rect x="${x-s/4}" y="${y-s/4}" width="${s/2}" height="${s/2}" class="ink"/>${arrow(x,y-s/2-4,'u',3)}${arrow(x,y+s/2+4,'d',3)}${arrow(x-s/2-4,y,'l',3)}${arrow(x+s/2+4,y,'r',3)}`;
const grille=(x,y,s=14,lbl='RG')=>`<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" class="ink"/><line x1="${x-s/2}" y1="${y+s/2}" x2="${x+s/2}" y2="${y-s/2}" class="ink"/><text x="${x}" y="${y+s/2+10}" text-anchor="middle" font-size="8">${lbl}</text>`;
const egrille=(x,y,s=14,lbl='EG')=>`<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" class="ink"/><line x1="${x-s/2}" y1="${y+s/2}" x2="${x+s/2}" y2="${y-s/2}" class="ink"/><line x1="${x-s/2}" y1="${y-s/2}" x2="${x+s/2}" y2="${y+s/2}" class="ink"/><text x="${x}" y="${y+s/2+10}" text-anchor="middle" font-size="8">${lbl}</text>`;
const hexTag=(x,y,t)=>`<polygon points="${x},${y-8} ${x+7},${y-4} ${x+7},${y+4} ${x},${y+8} ${x-7},${y+4} ${x-7},${y-4}" class="ink" fill="#fff"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="8" font-weight="700">${t}</text>`;
const updn=(x,y,t)=>`<rect x="${x-12}" y="${y-9}" width="24" height="18" class="ink"/><line x1="${x-12}" y1="${y-9}" x2="${x+12}" y2="${y+9}" class="ink"/><line x1="${x+12}" y1="${y-9}" x2="${x-12}" y2="${y+9}" class="ink"/><text x="${x+15}" y="${y+3}" font-size="8">${t}</text>`;
const unit=(x,y,w,h,t)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="ink" fill="#fff"/><text x="${x+w/2}" y="${y+h/2+3}" text-anchor="middle" font-weight="700">${t}</text>`;
const louver=(x,y,w,t)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="12" class="ink"/>`;for(let i=2;i<w;i+=4)s+=`<line x1="${x+i}" y1="${y+1}" x2="${x+i}" y2="${y+11}" class="thin"/>`;return s+`<text x="${x+w/2}" y="${y+22}" text-anchor="middle" font-size="8">${t}</text>`};
const svg=(w,h,body)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const room=(x,y,w,h,n)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="wall"/><text x="${x+4}" y="${y+11}" font-size="7.5" fill="#3b444c">${n}</text>`;
const RM=['OFFICE','CONF','LAB','BREAK','RECORDS','TRAINING','RECEPTION','COPY','MGR','DRAFTING'];
const sz=()=>pick(['20x14','18x12','16x12','14x12','12x10','10x10','8x8']);
const rd=()=>pick(['6"ø','8"ø','10"ø','12"ø']);

// ---------- field scene helpers (section view) ----------
const attic=(body)=>{let s=`<rect x="0" y="0" width="240" height="130" class="sky"/><polygon points="0,60 120,6 240,60" fill="#fff" class="ink"/><line x1="0" y1="60" x2="240" y2="60" class="ink"/>`;for(let i=20;i<240;i+=40)s+=`<line x1="${i}" y1="${60}" x2="${i}" y2="${(120-Math.abs(120-i))*0.45+6}" class="hair"/>`;s+=`<rect x="0" y="60" width="240" height="70" fill="#fff"/><line x1="0" y1="72" x2="240" y2="72" class="ink"/><text x="6" y="82" font-size="6.5" fill="#8a939c">CEILING / ROOMS BELOW</text>`;return svg(240,130,s+body)};
const basement=(body)=>{let s=`<rect x="0" y="0" width="240" height="130" fill="#fff"/>`;for(let i=0;i<240;i+=16)s+=`<rect x="${i}" y="14" width="10" height="14" class="wood"/>`;s+=`<line x1="0" y1="14" x2="240" y2="14" class="ink"/><line x1="0" y1="118" x2="240" y2="118" class="wall"/><text x="6" y="128" font-size="7.5" fill="#3b444c">BASEMENT SLAB</text>`;return svg(240,130,s+body)};
const roof=(body)=>svg(240,130,`<rect x="0" y="0" width="240" height="130" class="sky"/><rect x="0" y="78" width="240" height="52" fill="#fff" class="ink"/><text x="6" y="124" font-size="7.5" fill="#3b444c">ROOF / TOP FLOOR CEILING BELOW</text>${body}`);
const furnace=(x,y)=>`<rect x="${x}" y="${y}" width="34" height="46" class="metal"/><text x="${x+17}" y="${y+20}" text-anchor="middle" font-size="7">FURN</text><text x="${x+17}" y="${y+30}" text-anchor="middle" font-size="7">AHU</text><polygon points="${x+8},${y+40} ${x+26},${y+40} ${x+17},${y+34}" class="fill"/>`;
const gr=(x,y,w,h,slots=4)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="face"/>`;for(let i=1;i<slots;i++)s+=`<line x1="${x+2}" y1="${y+h*i/slots}" x2="${x+w-2}" y2="${y+h*i/slots}" class="thin"/>`;return s};
const vanes=(x,y,w,h)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="face"/>`;for(let i=3;i<w;i+=5)s+=`<line x1="${x+i}" y1="${y+2}" x2="${x+i+2.5}" y2="${y+h-2}" class="thin"/>`;return s+`<circle cx="${x+w-4}" cy="${y+h/2}" r="1.5" class="fill"/>`};
const filter=(x,y,w,h)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#dfe8ee" class="ink"/>`;for(let i=3;i<w;i+=4)s+=`<line x1="${x+i}" y1="${y+1}" x2="${x+i+2}" y2="${y+h-1}" class="thin"/>`;return s};

// ---------- FLASH cues ----------
// each: id, stream, kind (print/field), name, draw(), tell
const CUES=[
 {id:'p_cd',s:'SA',k:'print',n:'Square cone diffuser',d:()=>svg(240,110,room(20,10,200,90,pick(RM))+diff(120,55,18)+hexTag(150,40,pick('ABCD'))+`<text x="120" y="95" text-anchor="middle" font-size="8">CD 24x24</text>`),t:'Square inside a square with arrows pushing out is a supply diffuser (CD). Arrows out = air out.'},
 {id:'p_rg',s:'RA',k:'print',n:'Return grille symbol',d:()=>svg(240,110,room(20,10,200,90,pick(RM))+grille(120,55,18,'RG')+`<text x="120" y="98" text-anchor="middle" font-size="8">${pick(['24x24 RG','RG-1','RETURN GRILLE'])}</text>`),t:'One diagonal, no arrows out, tagged RG. Single slash = return.'},
 {id:'p_eg',s:'EA',k:'print',n:'Exhaust grille in a toilet',d:()=>svg(240,110,room(20,10,110,90,pick(['TOILET','JAN.','MEN','WOMEN']))+room(130,10,90,90,'CORR')+egrille(75,55,16,'EG')+duct(75,20,75,45,8,'EA',null)+`<text x="60" y="16" font-size="7.5">TO EF-1</text>`),t:'X-hatched grille tagged EG in a toilet or janitor closet. That duct runs to an exhaust fan, never back to the unit.'},
 {id:'p_oal',s:'OA',k:'print',n:'Outside air louver',d:()=>svg(240,110,`<line x1="20" y1="30" x2="220" y2="30" class="wall"/><text x="24" y="24" font-size="7.5">EXTERIOR WALL</text>`+louver(90,26,60,'OA LOUVER W/ MOD')+duct(120,38,120,90,14,'OA',null)+`<text x="132" y="75" font-size="8">TO AHU-1 MIXING BOX</text><text x="30" y="100" font-size="7.5">${pick(['20x12 OA','16x12 OA'])}</text>`),t:'Louver on an exterior wall with a motorized damper (MOD) feeding the mixing box. That is outside air, not part of the loop you clean.'},
 {id:'p_shrink',s:'SA',k:'print',n:'Trunk stepping down away from unit',d:()=>{const a=pick(['24x14','20x14','18x14']);const b=pick(['14x14','12x12']);const c=pick(['10x10','8x8']);return svg(240,110,unit(10,35,40,40,pick(['RTU-1','AHU-2']))+duct(50,55,110,55,22,a,'r')+`<line x1="110" y1="44" x2="118" y2="48" class="ink"/><line x1="110" y1="66" x2="118" y2="62" class="ink"/>`+duct(118,55,175,55,14,b,'r')+`<line x1="175" y1="48" x2="181" y2="51" class="ink"/><line x1="175" y1="62" x2="181" y2="59" class="ink"/>`+duct(181,55,230,55,8,c,'r'))},t:'Duct gets smaller the farther it runs from the unit, arrows pointing away. Supply sheds air at every branch so it steps down.'},
 {id:'p_grow',s:'RA',k:'print',n:'Duct stepping up toward unit',d:()=>svg(240,110,duct(10,55,60,55,8,pick(['8x8','10x8']),'r')+`<line x1="60" y1="51" x2="66" y2="48" class="ink"/><line x1="60" y1="59" x2="66" y2="62" class="ink"/>`+duct(66,55,125,55,14,pick(['12x12','14x12']),'r')+`<line x1="125" y1="48" x2="133" y2="44" class="ink"/><line x1="125" y1="62" x2="133" y2="66" class="ink"/>`+duct(133,55,190,55,22,pick(['20x14','24x14']),'r')+unit(190,35,40,40,pick(['RTU-1','AHU-2']))),t:'Duct grows as it heads toward the unit, arrows pointing at the unit. Air is collecting, that is return.'},
 {id:'p_vav',s:'SA',k:'print',n:'VAV box inline',d:()=>svg(240,110,duct(10,40,80,40,14,pick(['16x12','14x12']),'r')+`<rect x="80" y="28" width="44" height="24" class="ink" fill="#fff"/><text x="102" y="43" text-anchor="middle" font-size="8" font-weight="700">VAV-${rnd(1,12)}</text>`+duct(124,40,175,40,10,pick(['10x8','8x8']),'r')+flex(175,40,210,75)+diff(215,82,14)+`<text x="102" y="66" text-anchor="middle" font-size="7.5">PRIMARY AIR</text>`),t:'A VAV box lives on the supply side, between the medium-pressure trunk and the diffusers it feeds. You will never find one on a return.'},
 {id:'p_eaup',s:'EA',k:'print',n:'EA UP to roof fan',d:()=>svg(240,110,room(20,10,100,90,pick(['TOILET','LOCKER','JAN.']))+egrille(60,60,16,'EG')+duct(60,52,60,30,8,null,'u')+updn(60,20,'EA UP TO EF-'+rnd(1,4))+`<text x="130" y="60" font-size="8">EF-${rnd(1,4)} ON ROOF</text><text x="130" y="72" font-size="7.5">${pick(['600 CFM','450 CFM','300 CFM'])}, BDD</text>`),t:'EA UP with a fan tag means it climbs to a roof exhaust fan. Its own system, its own count, no tie to the air handler.'},
 {id:'p_flexcd',s:'SA',k:'print',n:'Flex from branch to tagged diffuser',d:()=>svg(240,110,duct(10,30,140,30,10,pick(['10x8','8x8']),'r')+flex(100,35,150,80)+diff(158,86,16)+hexTag(185,70,pick('ABCD'))+`<text x="100" y="20" font-size="7.5">${rd()} FLEX W/ VD</text>`),t:'Hatched round run off a branch ending at a cone diffuser with a schedule tag. Supply branch, flex, damper at the takeoff.'},
 {id:'p_raup',s:'RA',k:'print',n:'RA UP to RTU',d:()=>svg(240,110,room(20,10,200,90,'CORRIDOR')+grille(70,60,18,'RG')+duct(78,60,140,60,18,pick(['24x18','20x14']),'r')+updn(150,60,'RA UP RTU-'+rnd(1,3))),t:'Return grille, big duct, RA UP to the rooftop unit. Return riser. On a two-story you will find this one in a shaft.'},
 {id:'p_tag',s:null,k:'print',n:'Bare duct tag',d:(c)=>{c._s=pick(['SA','RA','EA','OA']);return svg(240,110,duct(20,55,220,55,pick([12,16,20]),`${sz()} ${c._s}`,pick(['r','l'])))},t:'Read the tag. SA supply, RA return, EA exhaust, OA outside air. This is the one you should never miss.'},
 {id:'p_tg',s:'RA',k:'print',n:'Transfer grille between rooms',d:()=>svg(240,110,room(20,10,100,90,pick(RM))+room(120,10,100,90,'CORRIDOR')+`<rect x="112" y="48" width="16" height="14" class="ink"/><line x1="112" y1="62" x2="128" y2="48" class="ink"/><text x="120" y="76" text-anchor="middle" font-size="8">TG</text><text x="120" y="88" text-anchor="middle" font-size="7">12x12 TRANSFER</text>`+grille(170,30,14,'RG')+`<text x="150" y="98" font-size="7">RA VIA CLG PLENUM</text>`),t:'TG in a wall or above a door, no duct on it. It only exists so air can get back to the return. Return path, not supply.'},

// ---------- TRACE network ----------
function genNet(){
  const unitName=pick(['RTU-1','AHU-1','RTU-2']);
  const n={unit:unitName,segs:[],terms:[],vav:[]};
  const nb=rnd(2,3);
  const uy=92;
  const tx=[100,150,198];
  const sizes=['20x14','16x12','12x10','10x8'];
  let prev='unit';
  for(let i=0;i<nb;i++){
    const id='T'+(i+1);
    n.segs.push({id,name:`trunk ${sizes[i]}`,x1:i?tx[i-1]:54,x2:tx[i],y:uy,w:22-i*5,size:sizes[i],up:prev,type:'trunk'});
    const hasVav=Math.random()<.4;
    let up=id;
    if(hasVav){const v='VAV-'+(i+1);n.vav.push({id:v,x:tx[i],y:uy-40,up:id});up=v}
    const nd=rnd(1,2);
    for(let j=0;j<nd;j++){
      const d=String.fromCharCode(65+n.terms.length);
      n.terms.push({id:d,tag:d,x:tx[i]+(j?13:-13),y:hasVav?uy-74:uy+40,up,branch:'B'+(i+1)+(j+1),cfm:rnd(3,8)*50});
    }
    prev=id;
  }
  n.ret={grilles:['RG-1','RG-2'].slice(0,rnd(1,2)),x:100,y:168};
  return n;
}
function drawNet(n,hi,tapable){
  let s=unit(10,72,44,40,n.unit);
  n.segs.forEach(g=>{s+=duct(g.x1,g.y,g.x2,g.y,g.w,g.size,'r');if(hi===g.id)s+=`<line x1="${g.x1}" y1="${g.y}" x2="${g.x2}" y2="${g.y}" class="hi"/>`});
  n.vav.forEach(v=>{s+=duct(v.x,n.segs[0].y-11,v.x,v.y+10,8,null,'u')+`<rect x="${v.x-18}" y="${v.y-10}" width="36" height="20" class="ink" fill="#fff"/><text x="${v.x}" y="${v.y+3}" text-anchor="middle" font-size="7.5" font-weight="700">${v.id}</text>`;if(hi===v.id)s+=`<rect x="${v.x-18}" y="${v.y-10}" width="36" height="20" class="hi"/>`});
  n.terms.forEach(t=>{
    const src=n.vav.find(v=>v.id===t.up);
    const sx=src?src.x:t.x,sy=src?src.y-10:n.segs[0].y+11;
    const ey=t.y>60?t.y-10:t.y+10;
    s+=flex(sx+(src?(t.x>sx?6:-6):0),sy,t.x,ey);
    if(hi==='B'+t.branch)s+=`<line x1="${sx}" y1="${sy}" x2="${t.x}" y2="${ey}" class="hi"/>`;
    s+=`<g class="${tapable?'tap':''}" data-term="${t.id}"><rect x="${t.x-8}" y="${t.y-16}" width="23" height="32" fill="#fff" fill-opacity="0.01"/>${t.sel?`<rect x="${t.x-9}" y="${t.y-9}" width="18" height="18" class="sel"/>`:''}${diff(t.x,t.y,11)}${hexTag(t.x+12,t.y-11,t.tag)}</g>`;
    if(hi===t.id)s+=`<rect x="${t.x-9}" y="${t.y-9}" width="18" height="18" class="hi"/>`;
  });
  // return
  const rx=n.ret.x,ry=n.ret.y;
  s+=duct(30,112,30,ry,16,null,'u')+duct(30,ry,rx+30,ry,16,'RA 24x14','l');
  n.ret.grilles.forEach((g,i)=>{s+=grille(rx+30+i*40,ry,12,g);if(i)s+=duct(rx+30,ry,rx+30+i*40,ry,12,null,'l')});
  if(hi==='RA')s+=`<line x1="30" y1="112" x2="30" y2="${ry}" class="hi"/><line x1="30" y1="${ry}" x2="${rx+30}" y2="${ry}" class="hi"/>`;
  s+=`<text x="236" y="188" text-anchor="end" font-size="7" fill="#6a7480">PLAN, NTS</text>`;
  const top=n.vav.length?0:62;
  return `<svg viewBox="0 ${top} 240 ${192-top}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
function traceQ(n){
  const kind=pick(['dir','dir','up','up','dead','dead','stream']);
  if(kind==='dir'){
    const seg=pick(n.segs.concat([{id:'RA',type:'ret'}]));
    const ans=seg.type==='ret'?'Toward the unit':'Away from the unit';
    return {hi:seg.id,q:`Which way is air moving in the highlighted duct?`,opts:['Away from the unit','Toward the unit'],ans,tell:seg.type==='ret'?'Return: grilles gather air and it runs back to the unit. Follow the arrows in, size grows on the way.':'Supply: leaves the unit, feeds branches, shrinks as it goes. Arrows point away.'};
  }
  if(kind==='up'){
    const t=pick(n.terms);
    const upName=t.up.startsWith('VAV')?t.up:n.segs.find(s=>s.id===t.up).name;
    const pool=[n.unit,...n.segs.map(s=>s.name),...n.vav.map(v=>v.id),'return duct'].filter(x=>x!==upName);
    return {hi:t.id,q:`What is immediately upstream of diffuser ${t.tag}?`,opts:shuffle([upName,...shuffle(pool).slice(0,3)]),ans:upName,tell:t.up.startsWith('VAV')?`${t.tag} hangs off ${t.up}. Box first, then the flex, then the face. The trunk is two steps back.`:`${t.tag} is a flex branch straight off ${upName}. Nothing between them but a damper at the takeoff.`};
  }
  if(kind==='dead'){
    const choice=pick([...n.segs,...n.vav]);
    const dead=n.terms.filter(t=>{
      if(choice.id.startsWith('VAV'))return t.up===choice.id;
      const idx=n.segs.findIndex(s=>s.id===choice.id);
      const downstream=n.segs.slice(idx).map(s=>s.id);
      const upSeg=t.up.startsWith('VAV')?n.vav.find(v=>v.id===t.up).up:t.up;
      return downstream.includes(upSeg);
    }).map(t=>t.id);
    return {hi:choice.id,multi:true,q:`Block the highlighted ${choice.id.startsWith('VAV')?'VAV box':'trunk section'}. Tap every diffuser that goes dead, then Check.`,ans:dead,tell:choice.id.startsWith('VAV')?'Only the diffusers hanging off that box. Everything else on the trunk keeps running.':'Everything downstream of the block dies: this section\'s branches and every section past it. Upstream sections don\'t care.'};
  }
  const t=pick([{hi:'RA',s:'RA'},{hi:pick(n.segs).id,s:'SA'},{hi:pick(n.terms).id,s:'SA'}]);
  return {hi:t.hi,q:'Which stream is highlighted?',stream:true,ans:t.s,tell:t.s==='RA'?'Grilles to duct to unit, arrows at the unit. Return.':'Unit to trunk to branch to diffuser, arrows away. Supply.'};
}

// ---------- CALL cards ----------
const CALLS=[
 {id:'c_rg',n:'Return grille',d:()=>svg(240,90,room(20,6,200,78,'CORRIDOR')+grille(120,45,20,'RG 24x24')),ans:'Return first. Pull this grille, it is your vac point.',tell:'Return side gets done first and the grille opening is where the vac hooks in. Get negative on the return before anything gets opened up.'},
 {id:'c_flexcd',n:'Flex-fed supply diffuser',d:()=>svg(240,90,duct(10,25,120,25,10,'10x8','r')+flex(90,30,150,70)+diff(158,74,16)),ans:'Supply, after the return. Face off, soda rod from the boot, no hard rod in the flex.',tell:'Flex and 90s take the soft rod. Hard rod in flex tears the liner or pulls it off the collar.'},
 {id:'c_fd',n:'Fire damper at a rated wall',d:()=>svg(240,90,`<line x1="150" y1="6" x2="150" y2="84" class="wall"/><text x="156" y="16" font-size="7.5">2-HR WALL</text>`+duct(10,45,230,45,16,'16x12','r')+`<line x1="142" y1="36" x2="158" y2="54" class="ink"/><line x1="142" y1="54" x2="158" y2="36" class="ink"/><text x="150" y="72" text-anchor="middle" font-size="9" font-weight="700">FD</text>`),ans:'Nothing passes through. Access on each side, leave the fusible link alone.',tell:'Rods, hoses and whips do not go through a fire damper. Cut access each side and treat the wall as a boundary. Trip the link and you own the repair.'},
 {id:'c_vav',n:'VAV box',d:()=>svg(240,90,duct(10,45,80,45,14,'14x12','r')+`<rect x="80" y="30" width="50" height="30" class="ink" fill="#fff"/><text x="105" y="48" text-anchor="middle" font-size="9" font-weight="700">VAV-4</text>`+duct(130,45,200,45,10,'8x8','r')),ans:'Open the box, clean inlet and outlet, hands off the actuator and the flow sensor.',tell:'The controls are the expensive part. Inlet ring, damper blade, outlet, then close it up the way you found it.'},
 {id:'c_lined',n:'Lined duct',d:()=>svg(240,90,duct(10,45,230,45,20,'24x14 LINED','r')+Array.from({length:22},(_,i)=>`<line x1="${14+i*10}" y1="36" x2="${20+i*10}" y2="54" class="thin"/>`).join('')),ans:'Soft brush, low pressure, no whip. Note the liner condition.',tell:'Whips shred fiberglass liner and then you have made it worse. Soft bristle, gentle air, and write down if it is already coming apart.'},
 {id:'c_ahu',n:'The unit',d:()=>svg(240,90,unit(60,15,120,60,'RTU-1')+`<text x="120" y="60" text-anchor="middle" font-size="7.5">BLOWER · COIL · FILTERS</text>`),ans:'Blower wheel, coil, plenum, pan. New filter goes in last.',tell:'The unit is the root of everything. Clean it after the ductwork so it does not get re-dirtied, and the filter is the very last thing to touch.'},
 {id:'c_ea',n:'Exhaust duct to a roof fan',d:()=>svg(240,90,egrille(40,45,16,'EG')+duct(48,45,150,45,10,'10"ø EA','r')+updn(165,45,'EA UP EF-2')),ans:'Its own system. Own vac hookup, own count, ends at the fan not the unit.',tell:'Exhaust never comes back to the air handler, so a vac on the return does nothing for it. Hook at the fan or the grille and price it separately.'},
 {id:'c_oa',n:'Outside air louver',d:()=>svg(240,90,`<line x1="20" y1="20" x2="220" y2="20" class="wall"/>`+louver(90,16,60,'OA LOUVER W/ MOD')+duct(120,28,120,80,14,'OA',null)),ans:'Not in the loop. Check screen and damper, note it, do not rig a vac here.',tell:'The intake only matters as a dirt source. Clogged bird screen and a stuck damper get written up, then move on.'},
 {id:'c_alum',n:'Aluminum duct note',d:()=>svg(240,90,duct(10,45,230,45,18,'20x14','r')+`<text x="120" y="72" text-anchor="middle" font-size="8">NOTE: ALL DUCTWORK ALUMINUM, EXTERNALLY INSULATED</text>`),ans:'No magnets. Nylon brushes, back the whip pressure off.',tell:'Aluminum is soft and non-magnetic. Steel brushes gouge it, magnetic mounts do nothing, and heavy whips dent it.'},
 {id:'c_bath',n:'Bath fan',d:()=>attic(`<rect x="90" y="60" width="30" height="16" class="metal"/>`+gr(92,72,26,6,2)+flex(105,60,150,30)+`<rect x="146" y="14" width="14" height="16" class="metal"/>`),ans:'Not on the unit. Grille off, clean the fan housing, run the duct to the roof jack.',tell:'Bath fans are their own little exhaust systems. Housing, wheel, then the flex all the way to daylight.'},
 {id:'c_oldflex',n:'Crushed old flex in an attic',d:()=>attic(`<rect x="14" y="40" width="30" height="24" class="metal"/><text x="29" y="54" text-anchor="middle" font-size="6.5">AHU</text>`+flex(44,50,104,66)+flex(104,66,126,46)+`<line x1="98" y1="60" x2="112" y2="72" class="ink" stroke-width="2"/>`+flex(126,46,198,66)+`<path d="M150 50 q 10 12 22 6" class="ink" stroke-dasharray="2 1.5" stroke="#b26a00"/><text x="176" y="56" text-anchor="middle" font-size="6.5" fill="#b26a00">LINER TORN</text><text x="104" y="36" text-anchor="middle" font-size="6.5" fill="#b26a00">KINKED AT THE TRUSS</text><rect x="196" y="64" width="12" height="7" class="metal"/><text x="120" y="100" text-anchor="middle" font-size="7.5">OLD GREY FLEX, 1990s INSTALL</text>`),ans:'Replace call, not a clean call. Flag it, quote it.',tell:'Old flex with the inner liner letting go will not survive cleaning. Whipping it makes the problem yours. Write it up as a replacement.'},
 {id:'c_plenumret',n:'Ceiling plenum return',d:()=>roof(`<line x1="0" y1="78" x2="240" y2="78" class="ink"/>`+gr(100,74,40,4,1)+`<text x="120" y="60" text-anchor="middle" font-size="7.5">NO DUCT, OPEN PLENUM RETURN</text>`),ans:'No return duct to clean. Grilles, the unit\'s return inlet, and note the plenum condition.',tell:'You cannot clean a whole ceiling cavity. Scope is the grilles and where the plenum enters the unit, and a note on what is living above the tile.'},
];
const ACTIONS=CALLS.map(c=>c.ans);

// ---------- mastery ----------
const hist=id=>ST.h[id]||(ST.h[id]=[]);
const level=id=>{const h=hist(id);if(!h.length)return 0;const last=h.slice(-5);const ok=last.filter(x=>x.ok).length;const med=last.map(x=>x.ms).sort((a,b)=>a-b)[Math.floor(last.length/2)];if(last.length>=5&&ok===5&&med<1500)return 3;if(ok>=Math.ceil(last.length*.6))return 2;return 1};
const weight=id=>{const l=level(id);const miss=hist(id).slice(-5).filter(x=>!x.ok).length;return [4,6,2,.6][l]+miss*3};
let lastId=null;
function choose(pool){const w=pool.map(c=>c.id===lastId?0:weight(c.id));const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i]}return pool[pool.length-1]}
function record(id,ok,ms){hist(id).push({ok,ms});if(hist(id).length>12)ST.h[id]=hist(id).slice(-12);ST.reps++;ST.streak=ok?ST.streak+1:0;ST.best=Math.max(ST.best,ST.streak);save()}
const masteredCount=pool=>pool.filter(c=>level(c.id)===3).length;

// ---------- UI ----------
let tab='flash',t0=0,timer=null,filterKind='all';
const app=$('#app');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));tab=b.dataset.tab;clearTimeout(timer);render()});
const stat=pool=>`<div class="stat"><span>reps <b>${ST.reps}</b></span><span>streak <b>${ST.streak}</b></span><span>best <b>${ST.best}</b></span>${pool?`<span>boring <b>${masteredCount(pool)}/${pool.length}</b></span>`:''}</div>`;
const streamBtns=()=>`<div class="ans">${['SA','RA','EA','OA'].map((s,i)=>`<button class="${s.toLowerCase()}" data-a="${s}">${STREAM[s]}<br><span style="font-weight:400;font-size:12px;opacity:.85">${s} · key ${i+1}</span></button>`).join('')}</div>`;
function startTimer(sec,onEnd){const bar=$('#tbar i');if(!bar)return;bar.classList.remove('run');bar.style.transform='scaleX(1)';void bar.offsetWidth;bar.classList.add('run');bar.style.transitionDuration=sec+'s';bar.style.transform='scaleX(0)';clearTimeout(timer);timer=setTimeout(onEnd,sec*1000)}
function fb(ok,head,tell,ms){return `<div class="fb ${ok?'ok':'bad'}"><b class="h">${ok?'Yes':'No'} · ${head}${ms?` · ${(ms/1000).toFixed(1)}s`:''}</b>${tell}</div>`}

function render(){clearTimeout(timer);({flash:renderFlash,trace:renderTrace,call:renderCall,board:renderBoard})[tab]()}

function renderFlash(){
  const pool=CUES.filter(c=>filterKind==='all'||c.k===filterKind);
  const c=choose(pool);lastId=c.id;const img=c.d(c);const ans=c.s||c._s;
  const sec=level(c.id)===3?2:3;
  app.innerHTML=`<div class="card">${stat(pool)}
  <div class="row small mut" style="justify-content:space-between"><span>${c.k==='print'?'On the print':'In the field'}</span><span><button class="small ghost" data-f="all" ${filterKind==='all'?'disabled':''}>All</button> <button class="small ghost" data-f="print" ${filterKind==='print'?'disabled':''}>Print</button> <button class="small ghost" data-f="field" ${filterKind==='field'?'disabled':''}>Field</button></span></div>
  <div class="scene">${img}</div><div class="timer" id="tbar"><i></i></div><div class="q">Which stream?</div>${streamBtns()}<div id="fb"></div></div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filterKind=b.dataset.f;render()});
  t0=performance.now();
  const answer=a=>{clearTimeout(timer);const ms=a?performance.now()-t0:sec*1000;const ok=a===ans;record(c.id,ok,ms);
    app.querySelectorAll('.ans button').forEach(b=>{b.disabled=true;if(b.dataset.a===ans)b.classList.add('right');else if(b.dataset.a===a)b.classList.add('wrong')});
    $('#fb').innerHTML=fb(ok,a?`${STREAM[ans]}`:`Timed out, ${STREAM[ans]}`,c.t,a?ms:0)+`<div class="row" style="margin-top:10px"><button id="next">Next <kbd style="background:#fff3;color:#fff">space</kbd></button></div>`;
    $('#next').onclick=render;$('#next').focus()};
  app.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>answer(b.dataset.a));
  startTimer(sec,()=>answer(null));
  window.onkeydown=e=>{const i='1234'.indexOf(e.key);if(i>=0&&!app.querySelector('.ans button:disabled'))answer(['SA','RA','EA','OA'][i]);if(e.key===' '&&$('#next')){e.preventDefault();render()}};
}

function renderTrace(){
  const n=genNet();const q=traceQ(n);const id='tr_'+(q.multi?'dead':q.stream?'stream':q.q.startsWith('Which way')?'dir':'up');
  const sel=new Set();
  const draw=()=>{n.terms.forEach(t=>t.sel=sel.has(t.id));return drawNet(n,q.hi,!!q.multi)};
  app.innerHTML=`<div class="card">${stat(null)}<div class="scene" id="net">${draw()}</div><div class="q">${q.q}</div>
  ${q.stream?streamBtns():q.multi?`<div class="row" style="margin-top:8px"><button id="chk">Check</button><span class="small mut" id="selcount">0 tapped</span></div>`:`<div class="ans one">${q.opts.map(o=>`<button class="opt" data-a="${o}">${o}</button>`).join('')}</div>`}<div id="fb"></div></div>`;
  t0=performance.now();
  const done=(ok,head)=>{const ms=performance.now()-t0;record(id,ok,ms);$('#fb').innerHTML=fb(ok,head,q.tell,ms)+`<div class="row" style="margin-top:10px"><button id="next">Next <kbd style="background:#fff3;color:#fff">space</kbd></button></div>`;$('#next').onclick=render;$('#next').focus()};
  if(q.multi){
    const wire=()=>app.querySelectorAll('[data-term]').forEach(g=>g.onclick=()=>{const t=g.dataset.term;sel.has(t)?sel.delete(t):sel.add(t);$('#net').innerHTML=draw();$('#selcount').textContent=sel.size+' tapped';wire()});wire();
    $('#chk').onclick=()=>{const want=new Set(q.ans);const ok=want.size===sel.size&&[...want].every(x=>sel.has(x));n.terms.forEach(t=>t.sel=want.has(t.id));$('#net').innerHTML=drawNet(n,q.hi,false);$('#chk').disabled=true;done(ok,ok?'dead: '+q.ans.join(', '):'dead set is '+(q.ans.join(', ')||'none'))};
  }else{
    app.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;const ok=a===q.ans;app.querySelectorAll('.ans button').forEach(x=>{x.disabled=true;if(x.dataset.a===q.ans)x.classList.add('right');else if(x.dataset.a===a)x.classList.add('wrong')});done(ok,q.stream?STREAM[q.ans]:q.ans)});
    window.onkeydown=e=>{const i='1234'.indexOf(e.key);const bs=app.querySelectorAll('.ans button');if(i>=0&&bs[i]&&!bs[i].disabled)bs[i].click();if(e.key===' '&&$('#next')){e.preventDefault();render()}};
  }
}

function renderCall(){
  const c=choose(CALLS);lastId=c.id;
  const opts=shuffle([c.ans,...shuffle(ACTIONS.filter(a=>a!==c.ans)).slice(0,3)]);
  app.innerHTML=`<div class="card">${stat(CALLS)}<div class="small mut">${c.n}</div><div class="scene">${c.d()}</div><div class="q">What's the move?</div><div class="ans one">${opts.map(o=>`<button class="opt" data-a="${o}">${o}</button>`).join('')}</div><div id="fb"></div></div>`;
  t0=performance.now();
  app.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;const ok=a===c.ans;const ms=performance.now()-t0;record(c.id,ok,ms);app.querySelectorAll('.ans button').forEach(x=>{x.disabled=true;if(x.dataset.a===c.ans)x.classList.add('right');else if(x.dataset.a===a)x.classList.add('wrong')});$('#fb').innerHTML=fb(ok,c.n,c.tell,ms)+`<div class="row" style="margin-top:10px"><button id="next">Next <kbd style="background:#fff3;color:#fff">space</kbd></button></div>`;$('#next').onclick=render;$('#next').focus()});
  window.onkeydown=e=>{const i='1234'.indexOf(e.key);const bs=app.querySelectorAll('.ans button');if(i>=0&&bs[i]&&!bs[i].disabled)bs[i].click();if(e.key===' '&&$('#next')){e.preventDefault();render()}};
}

function renderBoard(){
  const cell=(c,label)=>{const l=level(c.id);const h=hist(c.id);const acc=h.length?Math.round(100*h.filter(x=>x.ok).length/h.length):null;const med=h.length?(h.map(x=>x.ms).sort((a,b)=>a-b)[Math.floor(h.length/2)]/1000).toFixed(1)+'s':'';return `<div class="cell m${l}">${c.n||label}<small>${h.length?`${acc}% · ${med} · ${['new','shaky','getting there','boring'][l]}`:'not seen yet'}</small></div>`};
  const tr=[{id:'tr_dir',n:'Flow direction'},{id:'tr_up',n:'What is upstream'},{id:'tr_dead',n:'What goes dead'},{id:'tr_stream',n:'Stream on a plan'}];
  const all=[...CUES,...tr,...CALLS];
  app.innerHTML=`<div class="card"><div class="score">${masteredCount(all)}<span class="mut" style="font-size:16px;font-weight:600"> / ${all.length} boring</span></div>${stat(null)}
  <div class="legend"><span><i style="background:#fff"></i>new</span><span><i style="background:#fbeaea"></i>shaky</span><span><i style="background:#fff5e0"></i>getting there</span><span><i style="background:#e3f2e6"></i>boring: last 5 right, under 1.5s</span></div>
  <b>Print cues</b><div class="grid" style="margin:6px 0 14px">${CUES.filter(c=>c.k==='print').map(c=>cell(c)).join('')}</div>
  <b>Field cues</b><div class="grid" style="margin:6px 0 14px">${CUES.filter(c=>c.k==='field').map(c=>cell(c)).join('')}</div>
  <b>Trace</b><div class="grid" style="margin:6px 0 14px">${tr.map(c=>cell(c)).join('')}</div>
  <b>Calls</b><div class="grid" style="margin:6px 0 14px">${CALLS.map(c=>cell(c)).join('')}</div>
  <details><summary>How the drill works</summary><p class="small">Every cue is weighted by how you did on it last. Misses come back fast, boring ones drift out. Flash gives you 3 seconds (2 once it is boring); no answer counts as a miss. Trace draws a fresh little system each time so you are reading the drawing, not remembering the picture. Board is per device, nothing leaves the phone.</p></details>
  <div class="row"><button class="ghost small" id="reset">Reset progress</button></div></div>`;
  $('#reset').onclick=e=>{if(e.target.dataset.arm){ST={h:{},reps:0,streak:0,best:0};save();render()}else{e.target.dataset.arm=1;e.target.textContent='Tap again to wipe'}};
}
render();
</script>
</body>
</html>
