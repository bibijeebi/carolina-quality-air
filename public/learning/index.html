<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DuctStudy moved to ductstudy.com</title>
<link rel="canonical" href="https://ductstudy.com/">
<body style="margin:0;background:#f3f6f8;color:#203746;font:17px/1.5 system-ui,sans-serif">
<div style="max-width:560px;margin:0 auto;padding:40px 20px">
<h1 style="color:#175878;margin:0 0 8px">DuctStudy has its own home now.</h1>
<p id="m">Taking you to <a id="a" href="https://ductstudy.com/">ductstudy.com</a> with your progress…</p>
</div>
<script>
// Hands a tech over from carolinaqualityair.xyz/learning/ to ductstudy.com: a one-time sign-in link if this browser
// was signed in, and the progress saved in this browser packed into the address fragment (never sent to a server).
(async () => {
  const HOME = "https://ductstudy.com/", API = "https://ductstudy.bennyforeman1.workers.dev";
  const g = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  let l = "", frag = "";
  const tok = g("vel-token") || g("ds_token");
  if (tok) { try { const r = await fetch(API + "/api/link", { method: "POST", headers: { authorization: "Bearer " + tok, "content-type": "application/json" }, body: "{}" }); if (r.ok) l = (await r.json()).link || ""; } catch (e) {} }
  const raw = g("vel-v1");
  if (raw && raw.length > 40 && window.CompressionStream) {
    try { const buf = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 32768) s += String.fromCharCode.apply(null, buf.subarray(i, i + 32768)); frag = "#import=" + btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); } catch (e) {}
  }
  if (!frag && /^#\/(ascs|cvi|dvt|dxc|field|library)/.test(location.hash)) frag = location.hash;
  const to = HOME + (l ? "?l=" + encodeURIComponent(l) : "") + frag;
  document.getElementById("a").href = to; location.replace(to);
})();
</script>
</body>
</html>
