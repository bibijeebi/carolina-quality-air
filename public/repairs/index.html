<style>
@font-face{font-family:"Archivo";src:url("/fonts/archivo-latin-var.woff2") format("woff2-variations");font-weight:100 900;font-stretch:62.5% 125%;font-display:swap}
:root{--blue:#0072bb;--navy:#0b2237;--ink:#17222c;--paper:#f4f7fa;--card:#fff;--mute:#5f6b76;--line:#d8dfe6}

.masthead .inner{max-width:720px;margin:0 auto}
.brand{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#9fc9e8}
.brand a{color:inherit;text-decoration:none}
h1{font-stretch:70%;font-weight:800;font-size:clamp(30px,7vw,44px);text-transform:uppercase;margin:8px 0 0}
.wrap{max-width:720px;margin:26px auto 0;padding:0 18px}
a.rep{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);padding:16px 18px;margin-bottom:14px;text-decoration:none;color:var(--ink)}
a.rep b{color:var(--navy);font-stretch:75%;font-weight:800;font-size:19px;display:block}
a.rep span{font-size:14px;color:var(--mute)}
</style>
</head>
